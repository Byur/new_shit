# dsh-feishu-agent 的 bundle patch：把插件插进 profile 的 loader 栈。
#
# 这条 insert 是插件出现在 boot manifest 里的必要条件；同一 profile 里不要重复 insert
# 同一个 id（loader 会直接报错）。
#
# 本文件只放**通用默认值**，不带任何本机路径、chat_id、密钥。真实配置按优先级取：
#
#   环境变量（含包根目录 .env，见 .env.example）
#     → $DSH_HOME/feishu-agent/local-config.json
#     → 这里的 bundle 默认值
#
# 环境变量（平铺，见 .env.example）：
#   FEISHU_AGENT_OWNER_OPEN_ID
#   FEISHU_AGENT_DEFAULT_WORKSPACE / _TITLE_PREFIX / _PERMISSION_PRESET / _AGENT_PRESET
#   FEISHU_AGENT_CHATS               JSON：chat_id → 频道配置，按 chat_id 覆盖
#   FEISHU_AGENT_ANSWER_CONCURRENCY
#
# 凭据（App ID / Secret）不写在这里，按优先级取：
#   凭据引用名 FEISHU_AGENT_APP_ID / FEISHU_AGENT_APP_SECRET
#   → 环境变量 FEISHU_AGENT_APP_ID / FEISHU_AGENT_APP_SECRET
#   → 包根目录的 .env

- insert:
    - id: feishu-agent
      name: 'dsh-feishu-agent'
      # 默认配置写在这里（bundle 层），不需要插件导出 Config schema 也能生效。
      # 你自己的 profile 里**不要**再给这个 id 写 config——没有 Config 导出的插件，
      # 带 config 的条目会被 loader 判成 did not activate 并静默跳过。
      config:
        # 留空：owner 从环境变量 / 本机配置取，都没有时由第一条私聊自举。
        ownerOpenId: ''
        # chat_id → 落哪个 Workspace。留空表示「不预设」：没配到的 chat 会收到
        # 「这个会话没有配置工作区」的提示，而不是悄悄落进一个 /path/to/your/workspace。
        # 想写死在这里也可以（环境变量与 local-config.json 里的同键会覆盖它）：
        #   '*':
        #     workspacePath: /path/to/workspace
        #     titlePrefix: '[飞书]'
        #     permissionPreset: workspace-write
        chats: {}
        schedules: []
        answerConcurrency: 3
        # CLI 子进程：Desktop 沙箱不让子进程写 ~/.dsh/profile，所以给它一个可写的 DSH_HOME。
        cliPath: /Applications/DeepSeek Harness.app/Contents/Resources/runtime/cli/bin/dsh
        cliProfile: headless
        # 子进程用的 DSH_HOME：Desktop 沙箱不允许子进程改写自己的 profile 目录，
        # 所以指向一个可写的 DSH_HOME。留空则读 FEISHU_AGENT_CLI_HOME 环境变量。
        cliHome: ''
        # 要从凭据存储注入 CLI 子进程的 provider key（apiKeyEnv 只认进程环境变量）。
        # 项目 .env 里的 *_API_KEY 也会被子进程继承，这里只是补凭据存储那份。
        cliEnvRefs:
          - DEEPSEEK_API_KEY
        # 意图路由（默认关闭，推荐在 ~/.dsh/feishu-agent/local-config.json 开启并填写本机路径，支持热加载）
        router:
          enabled: false
          groupEnabled: false
          ollamaBaseUrl: http://127.0.0.1:11434
          classifierModel: qwen3:8b
          timeoutMs: 8000
          keepAlive: 30m
          localConfidence: 0.8
          contextWindowSec: 180
          # 写入前的本地处理：清噪由确定性规则完成，只在需要断句时才调用本地模型；失败落盘去噪结果。
          # maxChars / maxItems 只限制模型断句，超限时仍会执行规则清噪。
          polish:
            enabled: true
            timeoutMs: 6000
            maxChars: 300
            maxItems: 6
          # 本地分类器健康嗅探：TTL 缓存 + 连续失败熔断，避免每次等分类超时。
          health:
            enabled: true
            ttlMs: 30000
            cooldownMs: 60000
            failureThreshold: 2
            # 单次探测超时（毫秒，200~5000）；低于 200 会被夹到 200。
            probeTimeoutMs: 400
          routes:
            dsh:
              provider: ''
              model: ''
              label: 4.1 Flash
            local:
              provider: ollama
              model: qwen3:8b
              permissionPreset: read-only
              titlePrefix: '[飞书·本地]'
              label: 本地 Qwen3
            obsidian:
              inboxDir: ''
              label: 待整理
