<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none';">
  <title>Wizz Skill Safekeeper 安全审查报告</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f3f5f7, #0e1318);
      --surface: light-dark(#ffffff, #151b21);
      --surface-soft: light-dark(#f7f8fa, #1b232b);
      --surface-strong: light-dark(#edf1f4, #222c35);
      --text: light-dark(#17212b, #eef3f6);
      --text-soft: light-dark(#4f5d69, #b2bec7);
      --text-faint: light-dark(#6b7883, #8e9ba5);
      --line: light-dark(#dce2e7, #303b45);
      --line-strong: light-dark(#bcc7d0, #465561);
      --primary: light-dark(#173f66, #8fc5f2);
      --primary-strong: light-dark(#0e3152, #b7dcfa);
      --primary-soft: light-dark(#eaf2f9, #172c3d);
      --flow-accent: light-dark(#74b8b4, #3f7779);
      --safe: light-dark(#166342, #6fd6a6);
      --safe-soft: light-dark(#e9f5ef, #153227);
      --warn: light-dark(#875600, #f3bd60);
      --warn-soft: light-dark(#fff4dc, #382b14);
      --high: light-dark(#a73b2b, #ff9687);
      --high-soft: light-dark(#fcece8, #3d211e);
      --critical: light-dark(#8a234d, #ff89b2);
      --critical-soft: light-dark(#faeaf1, #3a1d2a);
      --data: light-dark(#276890, #7fc4ec);
      --data-soft: light-dark(#e9f3f8, #16303f);
      --integrity: light-dark(#a04135, #f89b8e);
      --integrity-soft: light-dark(#faece9, #3a211e);
      --human: light-dark(#8a620f, #e8c46f);
      --human-soft: light-dark(#f9f1dd, #342b18);
      --commerce: light-dark(#6d4b91, #c7a5e8);
      --commerce-soft: light-dark(#f2ecf8, #2c2237);
      --other: light-dark(#52616d, #aab7c0);
      --other-soft: light-dark(#edf0f2, #252d33);
      --shadow: 0 14px 40px light-dark(rgba(23, 33, 43, .07), rgba(0, 0, 0, .2));
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body { min-width: 540px; margin: 0; background: var(--bg); color: var(--text); }
    body.drawer-open { overflow: hidden; }
    button, input { font: inherit; }
    button, input {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 2px;
    }
    button { cursor: pointer; }
    input {
      min-height: 32px;
      padding: 4px 8px;
      font-size: 12px;
      transition: background-color 160ms ease;
    }
    input:hover { background: var(--surface-soft); }
    button:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 35%, transparent);
      outline-offset: 2px;
    }
    input:focus-visible { outline: 0; border-color: var(--line); background: var(--primary-soft); box-shadow: none; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: clamp(20px, 2vw, 25px); letter-spacing: -.02em; }
    h2 { margin-bottom: 0; font-size: 18px; letter-spacing: -.01em; }
    h3 { font-size: 15px; }
    .shell { min-height: 100vh; }
    .app-header {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 64px; padding: 8px clamp(16px, 4vw, 48px);
      border-top: 2px solid var(--primary-strong); border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-mark {
      display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto;
      border-radius: 2px; background: var(--primary); color: light-dark(#fff, #0e1a24);
    }
    .brand-mark svg { width: 16px; height: 16px; }
    main { max-width: 1440px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 48px) 48px; }
    .report-intro {
      display: flex; justify-content: space-between; align-items: end; gap: 32px;
      padding-bottom: 24px;
    }
    .eyebrow {
      margin-bottom: 8px; color: var(--primary); font-size: 12px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
    }
    .report-intro h2 { max-width: 740px; font-size: clamp(25px, 4vw, 42px); line-height: 1.13; letter-spacing: -.035em; }
    .intro-note { max-width: 440px; margin-bottom: 0; color: var(--text-soft); font-size: 14px; line-height: 1.65; }
    .stats {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 24px; border: 1px solid var(--line); border-radius: 2px;
      background: var(--surface); box-shadow: var(--shadow); overflow: hidden;
    }
    .stat { min-width: 0; padding: 16px; border-left: 1px solid var(--line); }
    .stat:first-child { border-left: 0; }
    .stat-label { display: block; color: var(--text-faint); font-size: 12px; }
    .stat strong { display: block; margin-top: 8px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
    .panel { border: 1px solid var(--line); border-radius: 2px; background: var(--surface); min-width: 0; }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 56px; padding: 16px; border-bottom: 1px solid var(--line);
    }
    .panel-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .count { color: var(--text-faint); font-size: 12px; white-space: nowrap; }
    .results-layout { display: block; }
    .results-panel { overflow: visible; }
    .toolbar {
      display: grid; grid-template-columns: minmax(220px, 1fr) minmax(170px, .35fr);
      gap: 16px; padding: 16px; border-bottom: 1px solid var(--line); background: var(--surface-soft);
    }
    .field { position: relative; display: grid; gap: 8px; }
    .field label { color: var(--text-faint); font-size: 11px; font-weight: 650; letter-spacing: .03em; }
    .field:focus-within label { color: var(--primary); }
    .field input { width: 100%; }
    .field input::placeholder { color: var(--text-faint); }
    .custom-select { position: relative; min-width: 0; }
    .custom-select-trigger {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      width: 100%; min-height: 32px; padding: 4px 8px; text-align: left;
      font-size: 12px; transition: background-color 160ms ease, color 160ms ease;
    }
    .custom-select-trigger:hover:not(:disabled) { background: var(--surface-soft); }
    .custom-select-trigger:focus-visible { outline: 0; border-color: var(--line); background: var(--primary-soft); }
    .custom-select-trigger[aria-expanded="true"] { background: var(--primary-soft); color: var(--primary); }
    .custom-select-trigger:disabled { color: var(--text-faint); background: var(--surface-strong); cursor: not-allowed; opacity: .68; }
    .custom-select-trigger svg { width: 14px; height: 14px; flex: 0 0 auto; transition: transform 160ms ease; }
    .custom-select-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }
    .custom-select-menu {
      position: absolute; top: calc(100% + 4px); right: 0; left: 0; z-index: 30;
      display: grid; gap: 2px; padding: 4px; border: 1px solid var(--line-strong);
      border-radius: 2px; background: var(--surface); box-shadow: var(--shadow);
    }
    .custom-select-option {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      width: 100%; min-height: 36px; padding: 8px; border: 0; border-radius: 2px;
      background: transparent; color: var(--text-soft); text-align: left; font-size: 12px;
    }
    .custom-select-option:hover, .custom-select-option.is-active { background: var(--surface-soft); color: var(--text); }
    .custom-select-option[aria-selected="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
    .custom-select-option:focus-visible { outline: 0; background: var(--surface-strong); }
    .custom-select-option svg { width: 14px; height: 14px; opacity: 0; }
    .custom-select-option[aria-selected="true"] svg { opacity: 1; }
    .skill-list { display: grid; overflow: hidden; border-radius: 0 0 2px 2px; }
    .skill-card {
      position: relative; border-bottom: 1px solid var(--line); background: var(--surface);
      transition: background-color 160ms ease, box-shadow 160ms ease;
    }
    .skill-card:last-child { border-bottom: 0; }
    .skill-card.is-active {
      background: var(--primary-soft); box-shadow: inset 2px 0 0 var(--primary);
    }
    .skill-card-main {
      display: grid; grid-template-columns: minmax(220px, .9fr) minmax(270px, 1.2fr) minmax(184px, .72fr);
      gap: 16px; width: 100%; padding: 16px; border: 0; border-radius: 0;
      background: transparent; text-align: left; color: inherit;
      transition: background-color 160ms ease, box-shadow 160ms ease;
    }
    .skill-card-main.has-recommendation { grid-template-columns: minmax(220px, .9fr) minmax(270px, 1.2fr) minmax(184px, .72fr); }
    .skill-card-main:hover { background: color-mix(in srgb, var(--primary-soft) 56%, transparent); }
    .skill-card-main:active { background: var(--surface-strong); }
    .skill-card-main[aria-pressed="true"] {
      background: color-mix(in srgb, var(--primary-soft) 76%, transparent);
    }
    .skill-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .skill-name { display: block; margin-bottom: 8px; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .path { display: block; color: var(--text-faint); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
    .recommendation { align-self: start; color: var(--text-soft); font-size: 12px; line-height: 1.5; }
    .recommendation strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 11px; letter-spacing: .04em; }
    .analysis-trigger {
      position: relative; isolation: isolate; overflow: hidden;
      display: none; align-items: center; justify-content: space-between; gap: 8px;
      width: calc(100% - 32px); min-height: 44px; margin: 0 16px 16px; padding: 8px 16px;
      border-color: transparent; border-radius: 2px; background: var(--primary);
      color: light-dark(#fff, #0e1a24); font-size: 12px; font-weight: 750;
    }
    .analysis-trigger::before {
      content: ""; position: absolute; top: 50%; left: -50%; z-index: 0;
      width: 200%; aspect-ratio: 1; pointer-events: none;
      background: conic-gradient(
        from 0deg,
        transparent 0deg 38deg,
        color-mix(in srgb, var(--flow-accent) 36%, transparent) 62deg,
        var(--flow-accent) 88deg,
        color-mix(in srgb, var(--flow-accent) 36%, transparent) 114deg,
        transparent 138deg 218deg,
        color-mix(in srgb, var(--flow-accent) 36%, transparent) 242deg,
        var(--flow-accent) 268deg,
        color-mix(in srgb, var(--flow-accent) 36%, transparent) 294deg,
        transparent 318deg 360deg
      );
      transform: translateY(-50%) rotate(0turn); transform-origin: center;
      animation: analysis-border-flow 7.2s linear infinite;
    }
    .analysis-trigger::after {
      content: ""; position: absolute; inset: 2px; z-index: 1; border-radius: 1px;
      background: var(--primary); pointer-events: none;
    }
    .skill-card.is-active .analysis-trigger { display: flex; }
    .analysis-trigger span, .analysis-trigger svg { position: relative; z-index: 2; }
    .analysis-trigger svg { width: 16px; height: 16px; transition: transform 160ms ease; }
    .analysis-trigger:hover svg { transform: translateX(4px); }
    @keyframes analysis-border-flow {
      to { transform: translateY(-50%) rotate(1turn); }
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px; width: fit-content; min-height: 24px;
      padding: 0 8px; border: 1px solid currentColor; border-radius: 2px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .status-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .severity-critical { color: var(--critical); }
    .severity-high { color: var(--high); }
    .severity-medium { color: var(--warn); }
    .severity-low, .severity-info { color: var(--safe); }
    .severity-pending { color: var(--text-soft); }
    .taxonomy { display: grid; gap: 8px; align-content: start; }
    .taxonomy-empty { color: var(--text-faint); font-size: 12px; }
    .taxonomy-group {
      display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px;
      padding: 8px; border-left: 2px solid currentColor; border-radius: 2px;
    }
    .taxonomy-label { font-size: 11px; font-weight: 700; line-height: 1.55; }
    .taxonomy-values { display: flex; flex-wrap: wrap; gap: 8px 16px; min-width: 0; }
    .taxonomy-value { color: var(--text); font-size: 11px; line-height: 1.55; overflow-wrap: anywhere; }
    .taxonomy-value + .taxonomy-value::before { content: "/"; margin-right: 8px; color: currentColor; opacity: .45; }
    .taxonomy-data { color: var(--data); background: var(--data-soft); }
    .taxonomy-integrity { color: var(--integrity); background: var(--integrity-soft); }
    .taxonomy-human { color: var(--human); background: var(--human-soft); }
    .taxonomy-commerce { color: var(--commerce); background: var(--commerce-soft); }
    .taxonomy-other { color: var(--other); background: var(--other-soft); }
    .empty-results { padding: 48px 16px; color: var(--text-soft); text-align: center; }
    .drawer-scrim {
      position: fixed; inset: 0; z-index: 40; border: 0; border-radius: 0;
      background: rgba(5, 13, 20, .48); opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 160ms ease, visibility 160ms ease;
    }
    .drawer-scrim.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    .analysis-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; height: 100vh; height: 100dvh;
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto; width: min(480px, 100vw);
      border-left: 1px solid var(--line); background: var(--surface); box-shadow: -16px 0 40px rgba(5, 13, 20, .18);
      transform: translateX(100%); visibility: hidden;
      transition: transform 240ms cubic-bezier(.2, .8, .2, 1), visibility 240ms ease;
    }
    .analysis-drawer.is-open { transform: translateX(0); visibility: visible; }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 64px; padding: 8px 16px; border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .drawer-kicker { display: block; margin-bottom: 0; color: var(--primary); font-size: 10px; font-weight: 750; letter-spacing: .08em; }
    .drawer-close {
      display: grid; place-items: center; width: 32px; height: 32px; padding: 0;
      border-color: var(--line-strong); background: var(--surface-soft);
    }
    .drawer-close:hover { border-color: var(--primary); color: var(--primary); }
    .drawer-close svg { width: 16px; height: 16px; }
    .detail { min-height: 0; padding: 24px; overflow: auto; overscroll-behavior: contain; }
    .detail-empty { padding: 40px 16px; color: var(--text-faint); text-align: center; line-height: 1.6; }
    .detail h2 { margin-bottom: 8px; font-size: 21px; overflow-wrap: anywhere; }
    .detail-description { color: var(--text-soft); font-size: 13px; line-height: 1.6; }
    .detail-status { display: grid; gap: 8px; margin: 16px 0; }
    .decision-row {
      display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: baseline;
      padding: 8px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface-soft);
    }
    .decision-label { color: var(--text-faint); font-size: 11px; font-weight: 650; }
    .decision-value { font-size: 12px; font-weight: 650; }
    .review-status {
      display: flex; align-items: flex-start; gap: 8px; padding: 8px;
      border: 1px solid var(--line); border-radius: 2px; font-size: 12px; line-height: 1.5;
    }
    .review-status svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; }
    .review-status strong { display: block; font-size: 12px; }
    .review-status small { display: block; margin-top: 2px; color: var(--text-soft); font-size: 11px; }
    .review-status.is-confirmed { border-color: color-mix(in srgb, var(--safe) 48%, var(--line)); background: var(--safe-soft); color: var(--safe); }
    .review-status.is-pending { background: var(--surface-soft); color: var(--text-soft); }
    .conclusion {
      margin: 16px 0 8px; padding: 16px; border-left: 2px solid var(--primary);
      background: var(--primary-soft); font-size: 13px; line-height: 1.65;
    }
    .detail-taxonomy { margin: 16px 0; }
    .detail-section-title { margin: 24px 0 8px; color: var(--text-faint); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .finding { padding: 16px 0; border-top: 1px solid var(--line); }
    .finding h3 { margin-bottom: 8px; line-height: 1.45; }
    .finding p { margin-bottom: 8px; font-size: 13px; line-height: 1.62; }
    .finding-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--text-faint); font-size: 11px; line-height: 1.5; }
    .finding-meta span + span::before { content: "·"; margin-right: 16px; }
    .verification-state { color: var(--safe); font-weight: 700; }
    .verification-state svg { width: 12px; height: 12px; margin-right: 4px; vertical-align: -2px; }
    .external-site {
      display: grid; gap: 8px; margin: 16px 0 8px; padding: 16px;
      border: 1px solid var(--line); border-left: 2px solid var(--data); background: var(--data-soft);
    }
    .external-site h4 { margin: 0; color: var(--data); font-size: 12px; }
    .external-site dl { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 8px; margin: 0; }
    .external-site dt { color: var(--text-faint); font-size: 11px; }
    .external-site dd { margin: 0; font-size: 12px; overflow-wrap: anywhere; }
    .external-site-note { margin: 0 !important; color: var(--text-soft); font-size: 12px !important; }
    .drawer-action {
      padding: 16px 24px 24px; border-top: 1px solid var(--line); background: var(--surface);
    }
    .drawer-action button {
      width: 100%; min-height: 40px; padding: 8px 16px; border-color: var(--primary);
      background: var(--primary); color: light-dark(#fff, #0e1a24); font-weight: 700;
      transition: filter 160ms ease;
    }
    .drawer-action button:hover { filter: brightness(1.08); }
    .copy-toast {
      position: absolute; top: 50%; left: 50%; z-index: 5; width: min(calc(100% - 32px), 360px);
      display: flex; align-items: flex-start; gap: 8px; padding: 12px 16px;
      border: 1px solid color-mix(in srgb, var(--safe) 48%, var(--line)); border-radius: 2px;
      background: var(--surface); box-shadow: var(--shadow); color: var(--text);
      opacity: 0; transform: translate(-50%, calc(-50% + 8px)); pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .copy-toast.is-visible { opacity: 1; transform: translate(-50%, -50%); }
    .copy-toast svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 1px; color: var(--safe); }
    .copy-toast strong { display: block; margin-bottom: 2px; color: var(--safe); font-size: 12px; }
    .copy-toast span { display: block; color: var(--text-soft); font-size: 12px; line-height: 1.55; }
    .copy-toast.is-error { border-color: color-mix(in srgb, var(--warn) 48%, var(--line)); }
    .copy-toast.is-error svg, .copy-toast.is-error strong { color: var(--warn); }
    .relationship { margin-top: 16px; overflow: hidden; }
    .relationship-controls { display: flex; align-items: center; gap: 8px; }
    .relationship-controls label { color: var(--text-faint); font-size: 11px; }
    .relationship-controls .custom-select { min-width: 184px; }
    .relationship-body { display: grid; grid-template-columns: minmax(0, 1fr) 256px; min-height: 472px; }
    #graph { display: block; width: 100%; height: 520px; touch-action: none; }
    .edge { stroke: var(--line-strong); stroke-width: 1; opacity: .68; }
    .edge.active { stroke: var(--primary); stroke-width: 2; opacity: 1; }
    .node { cursor: grab; }
    .node:active { cursor: grabbing; }
    .node circle { stroke: var(--surface); stroke-width: 2; }
    .node text {
      fill: var(--text); font-size: 11px; paint-order: stroke;
      stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: all;
    }
    .node .hit-area { fill: transparent; stroke: none; pointer-events: all; }
    .node.dim { opacity: .14; }
    .node.selected circle { stroke: var(--primary); stroke-width: 4; }
    .legend {
      display: grid; align-content: start; gap: 16px; padding: 16px;
      border-left: 1px solid var(--line); background: var(--surface-soft);
    }
    .legend-title { margin-bottom: 0; color: var(--text-faint); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; color: var(--text-soft); font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    @media (max-width: 1080px) {
      .skill-card-main { grid-template-columns: minmax(190px, .8fr) minmax(240px, 1.2fr); }
      .skill-card-main.has-recommendation { grid-template-columns: minmax(190px, .8fr) minmax(240px, 1.2fr); }
      .skill-card-main.has-recommendation .recommendation { grid-column: 1 / -1; display: grid; grid-template-columns: 88px 1fr; gap: 8px; }
    }
    @media (max-width: 860px) {
      .report-intro { display: block; }
      .intro-note { margin-top: 16px; }
      .relationship-body { grid-template-columns: 1fr; }
      .legend { grid-template-columns: repeat(3, minmax(0, 1fr)); border-left: 0; border-top: 1px solid var(--line); }
      .legend-title { grid-column: 1 / -1; }
      #graph { height: 432px; }
    }
    @media (min-width: 540px) and (max-width: 640px) {
      .app-header { position: static; padding: 8px 16px; }
      main { padding: 24px 16px 32px; }
      .report-intro h2 { font-size: 26px; }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .stat { padding-inline: 8px; border-top: 0; }
      .toolbar { grid-template-columns: 1fr; }
      input, .custom-select-trigger, .custom-select-option { min-height: 44px; }
      .skill-card-main { grid-template-columns: 1fr; gap: 16px; }
      .skill-card-main.has-recommendation { grid-template-columns: 1fr; }
      .skill-title-row { flex-wrap: wrap; }
      .skill-card-main.has-recommendation .recommendation { grid-column: auto; display: block; }
      .taxonomy-group { grid-template-columns: 80px minmax(0, 1fr); }
      .relationship .panel-head { align-items: stretch; flex-direction: column; }
      .relationship .panel-title { flex-wrap: wrap; }
      .relationship-controls { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; }
      .legend { grid-template-columns: 1fr 1fr; }
      #graph { height: 368px; }
      .analysis-drawer { width: 100vw; }
      .drawer-close { width: 44px; height: 44px; }
      .detail { padding: 16px; }
      .drawer-action { padding: 16px; }
      .detail-description, .finding p { font-size: 14px; }
      .drawer-action button { min-height: 44px; }
    }
    @media (min-width: 540px) and (max-height: 560px) and (orientation: landscape) {
      .app-header { position: static; }
      .analysis-drawer { width: min(520px, 72vw); }
      .drawer-head { min-height: 56px; }
      .detail { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .analysis-trigger::before { animation: none !important; background: color-mix(in srgb, var(--flow-accent) 48%, transparent); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 4.5 6.5v5.2c0 4.5 3 7.8 7.5 9.3 4.5-1.5 7.5-4.8 7.5-9.3V6.5L12 3Z"/>
            <path d="m8.7 12 2.1 2.1 4.6-4.6"/>
          </svg>
        </span>
        <h1>Wizz Skill Safekeeper</h1>
      </div>
    </header>
    <main>
      <section class="report-intro" aria-labelledby="report-title">
        <div>
          <div class="eyebrow">扫描报告</div>

        </div>
        <p class="intro-note" id="intro-note">先查看每个 Skill 的结论与建议；关系视图常驻在结果之后，用于理解共享资源和风险连接。</p>
      </section>

      <section class="stats" aria-label="扫描摘要">
        <div class="stat"><span class="stat-label">已检查 Skill</span><strong id="skill-count">0</strong></div>
        <div class="stat"><span class="stat-label">高风险及以上</span><strong id="high-count">0</strong></div>
        <div class="stat"><span class="stat-label">扫描文件</span><strong id="file-count">0</strong></div>
      </section>

      <div class="results-layout">
        <section class="panel results-panel" aria-labelledby="results-title">
          <div class="panel-head">
            <div class="panel-title"><h2 id="results-title">扫描结果</h2><span class="count" id="visible-count"></span></div>
          </div>
          <div class="toolbar" aria-label="筛选扫描结果">
            <div class="field">
              <label for="search">查找 Skill</label>
              <input id="search" type="search" placeholder="名称、说明或风险标签">
            </div>
            <div class="field">
              <label id="severity-label" for="severity">最低风险</label>
              <div class="custom-select" id="severity-select" data-value="pending">
                <button type="button" class="custom-select-trigger" id="severity" aria-haspopup="listbox" aria-expanded="false" aria-controls="severity-menu" aria-labelledby="severity-label severity-value">
                  <span id="severity-value">全部</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
                </button>
                <div class="custom-select-menu" id="severity-menu" role="listbox" aria-labelledby="severity-label" hidden>
                  <button type="button" class="custom-select-option" role="option" data-value="pending" aria-selected="true"><span>全部</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
                  <button type="button" class="custom-select-option" role="option" data-value="medium" aria-selected="false"><span>中风险及以上</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
                  <button type="button" class="custom-select-option" role="option" data-value="high" aria-selected="false"><span>高风险及以上</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
                  <button type="button" class="custom-select-option" role="option" data-value="critical" aria-selected="false"><span>仅严重</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>

      <section class="panel relationship" id="relationship-section" aria-labelledby="relationship-title">

                <span id="node-type-value">Skill 与关联资源</span>

                <button type="button" class="custom-select-option" role="option" data-value="all" aria-selected="true"><span>Skill 与关联资源</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
                <button type="button" class="custom-select-option" id="skill-only-option" role="option" data-value="skill" aria-selected="false"><span>仅 Skill</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>

        <div class="relationship-body">
          <svg id="graph" role="img" aria-label="Skill、外部站点、账号密钥与能力重叠关系图"></svg>
          <div class="legend" aria-label="图例">
            <div class="legend-title">图例</div>
            <span><i class="dot" style="background:var(--safe)"></i>低风险</span>
            <span><i class="dot" style="background:var(--warn)"></i>中风险</span>
            <span><i class="dot" style="background:var(--high)"></i>高风险</span>
            <span><i class="dot" style="background:var(--critical)"></i>严重风险</span>
            <span><i class="dot" style="background:var(--data)"></i>外部站点</span>
            <span><i class="dot" style="background:var(--human)"></i>账号密钥</span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <button type="button" class="drawer-scrim" id="drawer-scrim" aria-label="关闭 Skill 详细分析" tabindex="-1"></button>
  <aside class="analysis-drawer" id="analysis-drawer" role="dialog" aria-modal="true" aria-labelledby="analysis-title" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <span class="drawer-kicker">详细分析</span>
        <h2 id="analysis-title">Skill 分析</h2>
      </div>
      <button type="button" class="drawer-close" id="drawer-close" aria-label="关闭详细分析">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <div class="detail" id="detail" aria-live="polite"><div class="detail-empty">选择一个 Skill 查看分析</div></div>
    <div class="drawer-action" id="drawer-action" hidden></div>
    <div class="copy-toast" id="copy-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
      <div><strong id="copy-toast-title">复核请求已复制</strong><span id="copy-toast-message">请回到对话窗口，粘贴并发送给 Agent 继续复核。</span></div>
    </div>
  </aside>
  <script>
    "use strict";
    const report = __WIZZ_SKILL_KEEPER_REPORT__;
    const severityRank = {pending: -1, info: 0, low: 1, medium: 2, high: 3, critical: 4};
    const recommendationText = {
      keep: "可以继续使用，无需额外调整。",
      "keep-with-notice": "可以继续使用；在首次发生联网、读取敏感信息或产生费用前，用通俗文字告知用户。",
      "require-confirmation": "继续使用前，在发送数据、访问账号、产生费用或修改内容的当下再次询问用户。",
      restrict: "先缩小可访问的数据、站点、账号密钥和费用额度，再继续使用。",
      "explicit-only": "关闭自动触发；只在用户明确点名这个 Skill 时运行。",
      isolate: "暂时停止日常使用，确认并修复已发现的有害路径后再恢复。",
      uninstall: "停止使用并移除；如曾使用账号密钥，还应更换相关密钥。",
      "agent-review": "扫描已完成，需要 Agent 结合原文和代码上下文形成最终结论。"
    };
    const severityText = {
      info: "未见明显风险", low: "低风险", medium: "中风险",
      high: "高风险", critical: "严重风险", pending: "待 Agent 核验"
    };
    const confidenceText = {heuristic: "初步判断", probable: "较可信", confirmed: "证据充分", pending: "待核验"};
    const tagText = {
      "external-data-transfer": "数据可能发往外部站点", "credential-access": "访问账号密钥",
      "broad-file-access": "广泛读取文件", "unsafe-url-fetch": "不受限网址访问",
      "silent-telemetry": "未明示的数据采集", "arbitrary-code-execution": "执行任意代码",
      "content-rendering-boundary": "内容渲染边界", "unsafe-content-rendering": "内容注入已确认",
      "destructive-action": "破坏性操作", "obfuscated-behavior": "行为经过隐藏",
      "supply-chain-risk": "供应链风险", "documentation-mismatch": "文档与行为不一致",
      "scope-hijack": "偏离用户目标", "priority-escalation": "提升自身优先级",
      "instruction-conflict": "指令冲突", "authorization-overreach": "超出授权范围",
      "disclosure-suppression": "压制风险披露", "delayed-disclosure": "延后披露",
      "authority-imitation": "模仿权威身份", "manipulative-commerce": "商业诱导",
      "policy-evasion": "规避规则", "cognitive-overload": "制造认知负担",
      "paid-operation": "可能产生费用", "unverified-claims": "未经验证的声明"
    };
    const siteScaleText = {unknown: "暂不清楚", small: "小型", medium: "中型", large: "大型"};
    const siteRecognitionText = {unknown: "暂不清楚", niche: "小众或专业领域", regional: "区域性知名", "widely-known": "广为人知"};
    const siteSafetyText = {
      "not-reviewed": "本次未完成站点安全评价",
      "no-material-concern-found": "暂未发现明显问题",
      "concerns-found": "发现需要关注的问题"
    };
    const tagDimensions = [
      {key: "data", label: "数据与权限", tags: new Set(["external-data-transfer", "credential-access", "broad-file-access", "unsafe-url-fetch", "silent-telemetry"])},
      {key: "integrity", label: "执行与完整性", tags: new Set(["arbitrary-code-execution", "content-rendering-boundary", "unsafe-content-rendering", "destructive-action", "obfuscated-behavior", "supply-chain-risk", "documentation-mismatch"])},
      {key: "human", label: "提示与交互", tags: new Set(["scope-hijack", "priority-escalation", "instruction-conflict", "authorization-overreach", "disclosure-suppression", "delayed-disclosure", "authority-imitation", "manipulative-commerce", "policy-evasion", "cognitive-overload"])},
      {key: "commerce", label: "费用与承诺", tags: new Set(["paid-operation", "unverified-claims"])},
    ];
    const state = {selected: null, query: "", severity: "pending", nodeType: "all", drawerOpen: false};
    const byId = new Map(report.skills.map(function(skill) { return [skill.id, skill]; }));
    const graph = report.graph || {status: "pending-agent-review", nodes: [], edges: []};
    const svg = document.getElementById("graph");
    const shell = document.querySelector(".shell");
    const drawer = document.getElementById("analysis-drawer");
    const drawerScrim = document.getElementById("drawer-scrim");
    const drawerClose = document.getElementById("drawer-close");
    const drawerAction = document.getElementById("drawer-action");
    const copyToast = document.getElementById("copy-toast");
    let copyToastTimer = 0;
    const severitySelect = setupCustomSelect(document.getElementById("severity-select"), function(value) {
      state.severity = value; applyFilters();
    });
    const nodeTypeSelect = setupCustomSelect(document.getElementById("node-type-select"), function(value) {
      state.nodeType = value; drawGraph();
    });
    const graphSkillNodeIds = new Set(graph.nodes.filter(function(node) {
      return node.type === "skill";
    }).map(function(node) { return node.id; }));
    const hasSkillRelationships = graph.edges.some(function(edge) {
      return graphSkillNodeIds.has(edge.source) && graphSkillNodeIds.has(edge.target);
    });
    if (!hasSkillRelationships) {
      nodeTypeSelect.removeOption("skill");
      nodeTypeSelect.setDisabled(true, "当前 Skill 之间没有直接关联");
    }
    let simulationToken = 0;

    function showCopyToast(title, message, isError) {
      window.clearTimeout(copyToastTimer);
      copyToast.classList.toggle("is-error", Boolean(isError));
      document.getElementById("copy-toast-title").textContent = title;
      document.getElementById("copy-toast-message").textContent = message;
      copyToast.hidden = false;
      window.requestAnimationFrame(function() { copyToast.classList.add("is-visible"); });
      copyToastTimer = window.setTimeout(function() {
        copyToast.classList.remove("is-visible");
        window.setTimeout(function() {
          if (!copyToast.classList.contains("is-visible")) copyToast.hidden = true;
        }, 180);
      }, 5000);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char];
      });
    }
    function setupCustomSelect(root, onChange) {
      const trigger = root.querySelector(".custom-select-trigger");
      const menu = root.querySelector(".custom-select-menu");
      const valueLabel = trigger.querySelector("span");
      let options = Array.from(menu.querySelectorAll(".custom-select-option"));
      let value = root.dataset.value || (options[0] && options[0].dataset.value) || "";

      function currentOption() {
        return options.find(function(option) { return option.dataset.value === value; });
      }
      function sync() {
        options.forEach(function(option) {
          option.setAttribute("aria-selected", option.dataset.value === value ? "true" : "false");
        });
        const selected = currentOption();
        if (selected) valueLabel.textContent = selected.querySelector("span").textContent;
        root.dataset.value = value;
      }
      function close(restoreFocus) {
        menu.hidden = true;
        trigger.setAttribute("aria-expanded", "false");
        if (restoreFocus) trigger.focus();
      }
      function open() {
        if (trigger.disabled) return;
        document.querySelectorAll('.custom-select-trigger[aria-expanded="true"]').forEach(function(other) {
          if (other !== trigger) {
            other.setAttribute("aria-expanded", "false");
            document.getElementById(other.getAttribute("aria-controls")).hidden = true;
          }
        });
        menu.hidden = false;
        trigger.setAttribute("aria-expanded", "true");
        (currentOption() || options[0]).focus();
      }
      function choose(option) {
        if (!option) return;
        value = option.dataset.value;
        sync(); close(true); onChange(value);
      }
      function move(option, delta) {
        const index = Math.max(0, options.indexOf(option));
        options[(index + delta + options.length) % options.length].focus();
      }
      trigger.addEventListener("click", function() {
        if (trigger.getAttribute("aria-expanded") === "true") close(false); else open();
      });
      trigger.addEventListener("keydown", function(event) {
        if (["ArrowDown", "ArrowUp", "Enter", " "].includes(event.key)) {
          event.preventDefault(); open();
        }
      });
      function bindOptions() {
        options.forEach(function(option) {
          option.addEventListener("click", function() { choose(option); });
          option.addEventListener("keydown", function(event) {
            if (event.key === "ArrowDown" || event.key === "ArrowUp") {
              event.preventDefault(); move(option, event.key === "ArrowDown" ? 1 : -1);
            } else if (event.key === "Home" || event.key === "End") {
              event.preventDefault(); options[event.key === "Home" ? 0 : options.length - 1].focus();
            } else if (event.key === "Enter" || event.key === " ") {
              event.preventDefault(); choose(option);
            } else if (event.key === "Escape") {
              event.preventDefault(); close(true);
            } else if (event.key === "Tab") {
              close(false);
            }
          });
        });
      }
      document.addEventListener("pointerdown", function(event) {
        if (!root.contains(event.target)) close(false);
      });
      bindOptions(); sync();
      return {
        setDisabled: function(disabled, title) {
          trigger.disabled = disabled;
          trigger.title = title || "";
          trigger.setAttribute("aria-disabled", disabled ? "true" : "false");
          if (disabled) close(false);
        },
        removeOption: function(optionValue) {
          const option = options.find(function(item) { return item.dataset.value === optionValue; });
          if (option) option.remove();
          options = Array.from(menu.querySelectorAll(".custom-select-option"));
          if (!options.some(function(item) { return item.dataset.value === value; }) && options[0]) value = options[0].dataset.value;
          sync();
        }
      };
    }
    function displayTag(tag) { return tagText[tag] || tag.replace(/-/g, " "); }
    function groupTags(tags) {
      const remaining = new Set(tags || []);
      const groups = tagDimensions.map(function(dimension) {
        const values = (tags || []).filter(function(tag) { return dimension.tags.has(tag); });
        values.forEach(function(tag) { remaining.delete(tag); });
        return {key: dimension.key, label: dimension.label, values: values};
      }).filter(function(group) { return group.values.length; });
      if (remaining.size) groups.push({key: "other", label: "其他", values: Array.from(remaining)});
      return groups;
    }
    function renderTaxonomy(tags, className) {
      const groups = groupTags(tags);
      if (!groups.length) return '<div class="taxonomy-empty">未标记风险维度</div>';
      return '<div class="taxonomy ' + (className || "") + '">' + groups.map(function(group) {
        return '<div class="taxonomy-group taxonomy-' + group.key + '">' +
          '<span class="taxonomy-label">' + escapeHtml(group.label) + '</span>' +
          '<span class="taxonomy-values">' + group.values.map(function(tag) {
            return '<span class="taxonomy-value" title="' + escapeHtml(tag) + '">' + escapeHtml(displayTag(tag)) + '</span>';
          }).join("") + '</span></div>';
      }).join("") + '</div>';
    }
    function renderExternalSite(site) {
      if (!site) return "";
      return '<section class="external-site" aria-label="外部站点说明"><h4>外部站点说明</h4><dl>' +
        '<dt>站点属性</dt><dd>' + escapeHtml(site.category) + '</dd>' +
        '<dt>规模</dt><dd>' + escapeHtml(siteScaleText[site.scale] || site.scale) + '</dd>' +
        '<dt>知名度</dt><dd>' + escapeHtml(siteRecognitionText[site.recognition] || site.recognition) + '</dd>' +
        '<dt>安全评价</dt><dd>' + escapeHtml(siteSafetyText[site.safetyAssessment] || site.safetyAssessment) + '</dd>' +
        '</dl><p class="external-site-note">判断依据：' + escapeHtml(site.basis) + '</p></section>';
    }
    function filteredSkills() {
      const query = state.query.trim().toLowerCase();
      return report.skills.filter(function(skill) {
        const comparableSeverity = skill.verificationStatus === "agent-reviewed" ? skill.severity : skill.candidateSeverity;
        if (severityRank[comparableSeverity] < severityRank[state.severity]) return false;
        if (!query) return true;
        return [skill.name, skill.description].concat(skill.riskTags || skill.candidateTags || [])
          .join(" ").toLowerCase().includes(query);
      });
    }
    function renderList() {
      const skills = filteredSkills();
      document.getElementById("visible-count").textContent = "显示 " + skills.length + " / " + report.skills.length;
      const list = document.getElementById("skill-list");
      if (!skills.length) {
        list.innerHTML = '<div class="empty-results">没有符合当前筛选条件的 Skill</div>';
        return skills;
      }
      list.innerHTML = skills.map(function(skill) {
        const reviewed = skill.verificationStatus === "agent-reviewed";
        const displaySeverity = reviewed ? skill.severity : "pending";
        const displayRecommendation = reviewed ? skill.recommendation : "agent-review";
        const showRecommendation = reviewed && severityRank[displaySeverity] >= severityRank.medium;
        const recommendation = skill.reviewedRecommendation || recommendationText[displayRecommendation] || displayRecommendation;
        const active = state.selected === skill.id;
        return '<article class="skill-card' + (active ? " is-active" : "") + '">' +
          '<button type="button" class="skill-card-main' + (showRecommendation ? " has-recommendation" : "") + '" data-skill="' + escapeHtml(skill.id) + '" aria-pressed="' +
          (active ? "true" : "false") + '">' +
          '<span><span class="skill-title-row"><span><span class="skill-name">' + escapeHtml(skill.name) + '</span>' +
          '<span class="path">' + escapeHtml(skill.path) + '</span></span>' +
          '<span class="status-badge severity-' + displaySeverity + '">' + severityText[displaySeverity] + '</span></span></span>' +
          renderTaxonomy(skill.riskTags || skill.candidateTags || []) +
          (showRecommendation ? '<span class="recommendation"><strong>建议采取的措施</strong>' + escapeHtml(recommendation) + '</span>' : '') + '</button>' +
          (active ? '<button type="button" class="analysis-trigger" data-skill="' + escapeHtml(skill.id) +
            '" aria-controls="analysis-drawer" aria-expanded="' + (state.drawerOpen ? "true" : "false") + '">' +
            '<span>查看详细分析</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>' : '') +
          '</article>';
      }).join("");
      list.querySelectorAll(".skill-card-main").forEach(function(card) {
        card.addEventListener("click", function() { selectSkill(card.dataset.skill); });
      });
      list.querySelectorAll(".analysis-trigger").forEach(function(trigger) {
        trigger.addEventListener("click", function() { openDrawer(trigger.dataset.skill); });
      });
      return skills;
    }
    function openDrawer(id) {
      if (id && state.selected !== id) selectSkill(id);
      if (!state.selected) return;
      state.drawerOpen = true;
      renderList();
      drawer.classList.add("is-open");
      drawerScrim.classList.add("is-open");
      drawer.setAttribute("aria-hidden", "false");
      shell.setAttribute("inert", "");
      document.body.classList.add("drawer-open");
      drawerClose.focus();
    }
    function closeDrawer(restoreFocus) {
      if (!state.drawerOpen) return;
      const selectedId = state.selected;
      state.drawerOpen = false;
      drawer.classList.remove("is-open");
      drawerScrim.classList.remove("is-open");
      drawer.setAttribute("aria-hidden", "true");
      shell.removeAttribute("inert");
      document.body.classList.remove("drawer-open");
      renderList();
      if (restoreFocus !== false && selectedId) {
        const trigger = document.querySelector('.analysis-trigger[data-skill="' + CSS.escape(selectedId) + '"]');
        if (trigger) trigger.focus();
      }
    }
    function applyFilters() {
      const skills = renderList();
      if (state.selected && !skills.some(function(skill) { return skill.id === state.selected; })) {
        const drawerWasOpen = state.drawerOpen;
        state.selected = null;
        if (drawerWasOpen) closeDrawer(false);
        else renderList();
        drawerAction.hidden = true;
        drawerAction.innerHTML = "";
        document.getElementById("detail").innerHTML = skills.length
          ? '<div class="detail-empty">选择一个 Skill 查看分析</div>'
          : '<div class="detail-empty">没有符合当前筛选条件的 Skill</div>';
      }
      drawGraph();
    }
    function selectSkill(id) {
      const skill = byId.get(id);
      if (!skill) return;
      state.selected = id;
      const reviewed = skill.verificationStatus === "agent-reviewed";
      const displaySeverity = reviewed ? skill.severity : "pending";
      const displayRecommendation = reviewed ? skill.recommendation : "agent-review";
      const showRecommendation = reviewed && severityRank[displaySeverity] >= severityRank.medium;
      const recommendation = skill.reviewedRecommendation || recommendationText[displayRecommendation] || displayRecommendation;
      const findings = (skill.findings || []).length ? skill.findings.map(function(finding) {
        const findingSeverity = finding.status === "agent-verified" ? finding.severity : finding.candidateSeverity;
        const findingConfidence = finding.status === "agent-verified" ? finding.confidence : finding.candidateConfidence;
        return '<article class="finding"><h3 class="severity-' + findingSeverity + '">' + escapeHtml(finding.title) +
          '</h3><p>' + escapeHtml(finding.explanation) + '</p><div class="finding-meta">' +
          '<span>' + escapeHtml(displayTag(finding.tag)) + '</span>' +
          '<span>' + escapeHtml(severityText[findingSeverity]) + '</span>' +
          '<span class="' + (finding.status === "agent-verified" ? "verification-state" : "") + '">' +
          (finding.status === "agent-verified" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>核验完成' : "等待 Agent 核验") + '</span>' +
          '<span>' + escapeHtml(confidenceText[findingConfidence] || findingConfidence) + '</span>' +
          (finding.destination ? '<span>目标：' + escapeHtml(finding.destination) + '</span>' : '') +
          '</div>' + renderExternalSite(finding.externalSite) + '</article>';
      }).join("") : '<p class="detail-description">在当前分析范围内未发现需要展开的风险项。</p>';
      const prompt = "请使用 $wizz-skill-safekeeper，针对报告中的 Skill " + skill.name +
        "（ID: " + skill.id + "）执行 Agent 证据复核。请读取本报告旁的 evidence.json，" +
        "逐条核验候选信号的上下文、实际代码路径、提示词语用和文档冲突；不要执行目标 Skill，" +
        "不要把扫描器候选标签直接当成风险结论。先输出非技术结论；只有我明确要求时才展开源码位置和技术证据。";
      document.getElementById("detail").innerHTML =
        '<h2>' + escapeHtml(skill.name) + '</h2>' +
        '<p class="detail-description">' + escapeHtml(skill.description || "没有提供清晰的用途说明。") + '</p>' +
        '<div class="detail-status"><div class="decision-row"><span class="decision-label">风险结论</span>' +
        '<span class="status-badge severity-' + displaySeverity + '">' + severityText[displaySeverity] + '</span></div>' +
        (showRecommendation ? '<div class="decision-row"><span class="decision-label">建议采取的措施</span><span class="decision-value">' + escapeHtml(recommendation) + '</span></div>' : '') +
        (reviewed ? '<div class="review-status is-confirmed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span><strong>Agent 核验完成</strong><small>结论依据：' + escapeHtml(confidenceText[skill.confidence] || skill.confidence) + '</small></span></div>' :
          '<div class="review-status is-pending"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span><strong>等待 Agent 核验</strong><small>当前仅为扫描候选，尚未形成风险结论</small></span></div>') + '</div>' +
        '<div class="conclusion">' + escapeHtml(reviewed ? (skill.reviewedConclusion || "Agent 已完成证据复核。") : "等待 Agent 结合证据进行复核。") + '</div>' +
        '<div class="detail-section-title">风险维度</div>' + renderTaxonomy(skill.riskTags || skill.candidateTags || [], "detail-taxonomy") +
        '<div class="detail-section-title">具体发现</div>' + findings;
      drawerAction.hidden = false;
      drawerAction.innerHTML = '<button type="button" id="ask-agent">' + (reviewed ? "重新请求 Agent 复核" : "通过 Agent 请求复核") + '</button>';
      document.getElementById("ask-agent").addEventListener("click", async function() {
        if (window.openai && typeof window.openai.sendFollowUpMessage === "function") {
          await window.openai.sendFollowUpMessage({prompt: prompt, title: "分析 " + skill.name});
          showCopyToast("复核请求已发送", "请回到对话窗口继续与 Agent 对话。", false);
          return;
        }
        try {
          await navigator.clipboard.writeText(prompt);
          document.getElementById("ask-agent").textContent = "复核请求已复制";
          showCopyToast("复核请求已复制", "请回到对话窗口，粘贴并发送给 Agent 继续复核。", false);
        } catch (error) {
          document.getElementById("ask-agent").textContent = "复制失败，请重试";
          showCopyToast("未能自动复制", "请再次尝试；若仍失败，请回到对话窗口直接请求 Agent 复核。", true);
        }
      });
      renderList();
      drawGraph();
    }
    document.getElementById("search").addEventListener("input", function(event) {
      state.query = event.target.value; applyFilters();
    });
    drawerScrim.addEventListener("click", function() { closeDrawer(true); });
    drawerClose.addEventListener("click", function() { closeDrawer(true); });
    document.addEventListener("keydown", function(event) {
      if (!state.drawerOpen) return;
      if (event.key === "Escape") {
        event.preventDefault();
        closeDrawer(true);
        return;
      }
      if (event.key !== "Tab") return;
      const focusable = Array.from(drawer.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
        .filter(function(element) { return !element.hidden && element.offsetParent !== null; });
      if (!focusable.length) return;
      const firstFocusable = focusable[0];
      const lastFocusable = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === firstFocusable) {
        event.preventDefault(); lastFocusable.focus();
      } else if (!event.shiftKey && document.activeElement === lastFocusable) {
        event.preventDefault(); firstFocusable.focus();
      }
    });
    function nodeColor(node) {
      if (node.type === "domain") return "var(--data)";
      if (node.type === "credential") return "var(--human)";
      if (node.severity === "critical") return "var(--critical)";
      if (node.severity === "high") return "var(--high)";
      if (node.severity === "medium") return "var(--warn)";
      return "var(--safe)";
    }
    function graphSkillId(node) {
      return node.type === "skill" ? (node.skillId || node.id) : null;
    }
    function drawGraph() {
      simulationToken += 1;
      const token = simulationToken;
      const allowedSkills = new Set(filteredSkills().map(function(skill) { return skill.id; }));
      const allowedGraphSkillIds = new Set(graph.nodes.filter(function(node) {
        return node.type === "skill" && allowedSkills.has(graphSkillId(node));
      }).map(function(node) { return node.id; }));
      let nodes = graph.nodes.filter(function(node) {
        if (node.type === "skill") return allowedGraphSkillIds.has(node.id);
        if (state.nodeType === "skill") return false;
        return graph.edges.some(function(edge) { return allowedGraphSkillIds.has(edge.source) && edge.target === node.id; });
      });
      nodes = nodes.filter(function(node) { return node.type === "skill"; })
        .concat(nodes.filter(function(node) { return node.type !== "skill"; }))
        .slice(0, 250).map(function(node) { return Object.assign({}, node); });
      const nodeMap = new Map(nodes.map(function(node) { return [node.id, node]; }));
      const edges = graph.edges.filter(function(edge) {
        return nodeMap.has(edge.source) && nodeMap.has(edge.target);
      }).map(function(edge) { return Object.assign({}, edge); });
      svg.innerHTML = "";
      const width = Math.max(320, svg.clientWidth);
      const height = Math.max(320, svg.clientHeight);
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      if (!nodes.length) {
        svg.innerHTML = '<text x="' + width / 2 + '" y="' + height / 2 + '" text-anchor="middle" fill="var(--text-faint)">当前没有可展示的关联资源</text>';
        return;
      }
      nodes.forEach(function(node, index) {
        const angle = index / nodes.length * Math.PI * 2;
        const radius = Math.min(width, height) * (node.type === "skill" ? .23 : .37);
        node.x = width / 2 + Math.cos(angle) * radius;
        node.y = height / 2 + Math.sin(angle) * radius;
        node.vx = 0; node.vy = 0;
      });
      const edgeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      svg.append(edgeGroup, nodeGroup);
      const edgeEls = edges.map(function() {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("class", "edge"); edgeGroup.appendChild(line); return line;
      });
      const nodeEls = nodes.map(function(node) {
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const fullLabel = String(node.label);
        const visibleLabel = fullLabel.length > 28 ? fullLabel.slice(0, 27) + "…" : fullLabel;
        group.setAttribute("class", "node" + (state.selected === graphSkillId(node) ? " selected" : ""));
        group.setAttribute("role", node.type === "skill" ? "button" : "img");
        if (node.type === "skill") group.setAttribute("tabindex", "0");
        group.setAttribute("aria-label", node.type + ": " + fullLabel);
        if (visibleLabel !== fullLabel) {
          group.setAttribute("title", fullLabel);
          const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
          title.textContent = fullLabel;
          group.appendChild(title);
        }
        const hitArea = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        hitArea.setAttribute("class", "hit-area"); hitArea.setAttribute("r", node.type === "skill" ? "19" : "15");
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("r", node.type === "skill" ? "10" : "7"); circle.setAttribute("fill", nodeColor(node));
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", "13"); label.setAttribute("y", "4"); label.textContent = visibleLabel;
        if (visibleLabel !== fullLabel) label.setAttribute("title", fullLabel);
        group.append(hitArea, circle, label); nodeGroup.appendChild(group);
        if (node.type === "skill") {
          group.addEventListener("click", function() { selectSkill(graphSkillId(node)); });
          group.addEventListener("keydown", function(event) {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectSkill(graphSkillId(node)); }
          });
        }
        let dragging = false;
        group.addEventListener("pointerdown", function(event) { dragging = true; group.setPointerCapture(event.pointerId); });
        group.addEventListener("pointermove", function(event) {
          if (!dragging) return;
          const rect = svg.getBoundingClientRect();
          node.x = (event.clientX - rect.left) * width / rect.width;
          node.y = (event.clientY - rect.top) * height / rect.height;
          node.vx = 0; node.vy = 0; renderPositions();
        });
        group.addEventListener("pointerup", function() { dragging = false; });
        return group;
      });
      function renderPositions() {
        const selectedGraphIds = new Set(nodes.filter(function(node) {
          return graphSkillId(node) === state.selected;
        }).map(function(node) { return node.id; }));
        edges.forEach(function(edge, index) {
          const source = nodeMap.get(edge.source), target = nodeMap.get(edge.target);
          edgeEls[index].setAttribute("x1", source.x); edgeEls[index].setAttribute("y1", source.y);
          edgeEls[index].setAttribute("x2", target.x); edgeEls[index].setAttribute("y2", target.y);
          const active = state.selected && (selectedGraphIds.has(edge.source) || selectedGraphIds.has(edge.target));
          edgeEls[index].setAttribute("class", "edge" + (active ? " active" : ""));
        });
        nodes.forEach(function(node, index) {
          nodeEls[index].setAttribute("transform", "translate(" + node.x + "," + node.y + ")");
          const selected = graphSkillId(node) === state.selected;
          const connected = !state.selected || selected || edges.some(function(edge) {
            return (selectedGraphIds.has(edge.source) && edge.target === node.id) ||
              (selectedGraphIds.has(edge.target) && edge.source === node.id);
          });
          nodeEls[index].setAttribute("class", "node" + (selected ? " selected" : "") + (connected ? "" : " dim"));
        });
      }
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const iterations = reduced ? 1 : Math.min(180, 40 + nodes.length);
      let step = 0;
      function tick() {
        if (token !== simulationToken) return;
        const alpha = 1 - step / iterations;
        for (let i = 0; i < nodes.length; i += 1) {
          for (let j = i + 1; j < nodes.length; j += 1) {
            const a = nodes[i], b = nodes[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const distance2 = Math.max(36, dx * dx + dy * dy);
            const force = 130 * alpha / distance2;
            a.vx -= dx * force; a.vy -= dy * force; b.vx += dx * force; b.vy += dy * force;
          }
        }
        edges.forEach(function(edge) {
          const source = nodeMap.get(edge.source), target = nodeMap.get(edge.target);
          const dx = target.x - source.x, dy = target.y - source.y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          const desired = edge.type === "capability-overlap" ? 105 : 88;
          const force = (distance - desired) * .006 * alpha;
          source.vx += dx / distance * force; source.vy += dy / distance * force;
          target.vx -= dx / distance * force; target.vy -= dy / distance * force;
        });
        nodes.forEach(function(node) {
          node.vx += (width / 2 - node.x) * .0009 * alpha; node.vy += (height / 2 - node.y) * .0009 * alpha;
          node.vx *= .84; node.vy *= .84;
          node.x = Math.max(18, Math.min(width - 110, node.x + node.vx));
          node.y = Math.max(18, Math.min(height - 18, node.y + node.vy));
        });
        renderPositions(); step += 1;
        if (step < iterations) requestAnimationFrame(tick);
      }
      tick();
    }
    const highCount = report.summary.severityCounts
      ? (report.summary.severityCounts.high || 0) + (report.summary.severityCounts.critical || 0)
      : (report.summary.candidateSeverityCounts.high || 0) + (report.summary.candidateSeverityCounts.critical || 0);
    document.getElementById("skill-count").textContent = report.summary.skillCount;
    document.getElementById("high-count").textContent = highCount;
    document.getElementById("file-count").textContent = report.actual.fileCount.toLocaleString();
    document.getElementById("report-title").textContent = highCount
      ? "发现 " + highCount + " 个需要优先处理的 Skill"
      : "已完成检查，未发现高风险 Skill";
    document.getElementById("intro-note").textContent =
      "先查看每个 Skill 的结论与建议；关系视图常驻在结果之后，用于理解共享资源和风险连接。";
    const visible = renderList();
    const first = visible[0];
    if (first) selectSkill(first.id);
    window.addEventListener("resize", drawGraph);
  </script>
</body>
