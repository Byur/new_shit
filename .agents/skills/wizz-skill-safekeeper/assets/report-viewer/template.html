<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none';">
  <title>Wizz Skill Safekeeper 安全审查报告</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f3f5f7, #0e1318);
      --surface: light-dark(#ffffff, #151b21);
      --surface-soft: light-dark(#f7f8fa, #1b232b);
      --surface-strong: light-dark(#edf1f4, #222c35);
      --text: light-dark(#17212b, #eef3f6);
      --text-soft: light-dark(#4f5d69, #b2bec7);
      --text-faint: light-dark(#6b7883, #8e9ba5);
      --line: light-dark(#dce2e7, #303b45);
      --line-strong: light-dark(#bcc7d0, #465561);
      --primary: light-dark(#173f66, #8fc5f2);
      --primary-strong: light-dark(#0e3152, #b7dcfa);
      --primary-soft: light-dark(#eaf2f9, #172c3d);
      --flow-accent: light-dark(#74b8b4, #3f7779);
      --safe: light-dark(#166342, #6fd6a6);
      --safe-soft: light-dark(#e9f5ef, #153227);
      --warn: light-dark(#875600, #f3bd60);
      --warn-soft: light-dark(#fff4dc, #382b14);
      --high: light-dark(#a73b2b, #ff9687);
      --high-soft: light-dark(#fcece8, #3d211e);
      --critical: light-dark(#8a234d, #ff89b2);
      --critical-soft: light-dark(#faeaf1, #3a1d2a);
      --data: light-dark(#276890, #7fc4ec);
      --data-soft: light-dark(#e9f3f8, #16303f);
      --integrity: light-dark(#a04135, #f89b8e);
      --integrity-soft: light-dark(#faece9, #3a211e);
      --human: light-dark(#8a620f, #e8c46f);
      --human-soft: light-dark(#f9f1dd, #342b18);
      --commerce: light-dark(#6d4b91, #c7a5e8);
      --commerce-soft: light-dark(#f2ecf8, #2c2237);
      --other: light-dark(#52616d, #aab7c0);
      --other-soft: light-dark(#edf0f2, #252d33);
      --shadow: 0 14px 40px light-dark(rgba(23, 33, 43, .07), rgba(0, 0, 0, .2));
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body { min-width: 540px; margin: 0; background: var(--bg); color: var(--text); }
    body.drawer-open { overflow: hidden; }
    button, input { font: inherit; }
    button, input {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 2px;
    }
    button { cursor: pointer; }
    input {
      min-height: 32px;
      padding: 4px 8px;
      font-size: 12px;
      transition: background-color 160ms ease;
    }
    input:hover { background: var(--surface-soft); }
    button:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 35%, transparent);
      outline-offset: 2px;
    }
    input:focus-visible { outline: 0; border-color: var(--line); background: var(--primary-soft); box-shadow: none; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: clamp(20px, 2vw, 25px); letter-spacing: -.02em; }
    h2 { margin-bottom: 0; font-size: 18px; letter-spacing: -.01em; }
    h3 { font-size: 15px; }
    .shell { min-height: 100vh; }
    .app-header {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 64px; padding: 8px clamp(16px, 4vw, 48px);
      border-top: 2px solid var(--primary-strong); border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-mark {
      display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto;
      border-radius: 2px; background: var(--primary); color: light-dark(#fff, #0e1a24);
    }
    .brand-mark svg { width: 16px; height: 16px; }
    main { max-width: 1440px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 48px) 48px; }
    .report-intro {
      display: flex; justify-content: space-between; align-items: end; gap: 32px;
      padding-bottom: 24px;
    }
    .eyebrow {
      margin-bottom: 8px; color: var(--primary); font-size: 12px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
    }
    .report-intro h2 { max-width: 740px; font-size: clamp(25px, 4vw, 42px); line-height: 1.13; letter-spacing: -.035em; }
    .intro-note { max-width: 440px; margin-bottom: 0; color: var(--text-soft); font-size: 14px; line-height: 1.65; }
    .stats {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 24px; border: 1px solid var(--line); border-radius: 2px;
      background: var(--surface); box-shadow: var(--shadow); overflow: hidden;
    }
    .stat { min-width: 0; padding: 16px; border-left: 1px solid var(--line); }
    .stat:first-child { border-left: 0; }
    .stat-label { display: block; color: var(--text-faint); font-size: 12px; }
    .stat strong { display: block; margin-top: 8px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
    .panel { border: 1px solid var(--line); border-radius: 2px; background: var(--surface); min-width: 0; }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 56px; padding: 16px; border-bottom: 1px solid var(--line);
    }
    .panel-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .count { color: var(--text-faint); font-size: 12px; white-space: nowrap; }
    .results-layout {
      display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(400px, .65fr);
      gap: 16px; align-items: start;
    }
    .results-layout.showing-relationships { grid-template-columns: minmax(400px, .8fr) minmax(600px, 1.2fr); }
    .results-layout.relationships-wide { grid-template-columns: 1fr; }
    .results-layout.relationships-wide > * { grid-column: 1 / -1; }
    .results-panel { overflow: visible; }
    .toolbar {
      display: grid; grid-template-columns: minmax(220px, 1fr) minmax(170px, .35fr);
      gap: 16px; padding: 16px; border-bottom: 1px solid var(--line); background: var(--surface-soft);
    }
    .field { position: relative; display: grid; gap: 8px; }
    .field label { color: var(--text-faint); font-size: 11px; font-weight: 650; letter-spacing: .03em; }
    .field:focus-within label { color: var(--primary); }
    .field input { width: 100%; }
    .field input::placeholder { color: var(--text-faint); }
    .custom-select { position: relative; min-width: 0; }
    .custom-select-trigger {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      width: 100%; min-height: 32px; padding: 4px 8px; text-align: left;
      font-size: 12px; transition: background-color 160ms ease, color 160ms ease;
    }
    .custom-select-trigger:hover:not(:disabled) { background: var(--surface-soft); }
    .custom-select-trigger:focus-visible { outline: 0; border-color: var(--line); background: var(--primary-soft); }
    .custom-select-trigger[aria-expanded="true"] { background: var(--primary-soft); color: var(--primary); }
    .custom-select-trigger:disabled { color: var(--text-faint); background: var(--surface-strong); cursor: not-allowed; opacity: .68; }
    .custom-select-trigger svg { width: 14px; height: 14px; flex: 0 0 auto; transition: transform 160ms ease; }
    .custom-select-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }
    .custom-select-menu {
      position: absolute; top: calc(100% + 4px); right: 0; left: 0; z-index: 30;
      display: grid; gap: 2px; padding: 4px; border: 1px solid var(--line-strong);
      border-radius: 2px; background: var(--surface); box-shadow: var(--shadow);
    }
    .custom-select-option {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      width: 100%; min-height: 36px; padding: 8px; border: 0; border-radius: 2px;
      background: transparent; color: var(--text-soft); text-align: left; font-size: 12px;
    }
    .custom-select-option:hover, .custom-select-option.is-active { background: var(--surface-soft); color: var(--text); }
    .custom-select-option[aria-selected="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
    .custom-select-option:focus-visible { outline: 0; background: var(--surface-strong); }
    .custom-select-option svg { width: 14px; height: 14px; opacity: 0; }
    .custom-select-option[aria-selected="true"] svg { opacity: 1; }
    .skill-list { display: grid; overflow: hidden; border-radius: 0 0 2px 2px; }
    .skill-card {
      position: relative; border-bottom: 1px solid var(--line); background: var(--surface);
      transition: background-color 160ms ease, box-shadow 160ms ease;
    }
    .skill-card:last-child { border-bottom: 0; }
    .skill-card.is-active {
      background: var(--primary-soft); box-shadow: inset 2px 0 0 var(--primary);
    }
    .skill-card-main {
      display: grid; grid-template-columns: minmax(220px, .9fr) minmax(270px, 1.2fr) minmax(184px, .72fr);
      gap: 16px; width: 100%; padding: 16px; border: 0; border-radius: 0;
      background: transparent; text-align: left; color: inherit;
      transition: background-color 160ms ease, box-shadow 160ms ease;
    }
    .skill-card-main.has-recommendation { grid-template-columns: minmax(220px, .9fr) minmax(270px, 1.2fr) minmax(184px, .72fr); }
    .skill-card-main:hover { background: color-mix(in srgb, var(--primary-soft) 56%, transparent); }
    .skill-card-main:active { background: var(--surface-strong); }
    .skill-card-main[aria-pressed="true"] {
      background: color-mix(in srgb, var(--primary-soft) 76%, transparent);
    }
    .skill-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .skill-name { display: block; margin-bottom: 8px; font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .path { display: block; color: var(--text-faint); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
    .recommendation { align-self: start; color: var(--text-soft); font-size: 12px; line-height: 1.5; }
    .recommendation strong { display: block; margin-bottom: 8px; color: var(--text); font-size: 11px; letter-spacing: .04em; }
    .analysis-trigger {
      position: relative; isolation: isolate; overflow: hidden;
      display: none; align-items: center; justify-content: space-between; gap: 8px;
      width: calc(100% - 32px); min-height: 44px; margin: 0 16px 16px; padding: 8px 16px;
      border-color: transparent; border-radius: 2px; background: var(--primary);
      color: light-dark(#fff, #0e1a24); font-size: 12px; font-weight: 750;
    }
    .analysis-trigger::before {
      content: ""; position: absolute; top: 50%; left: -50%; z-index: 0;
      width: 200%; aspect-ratio: 1; pointer-events: none;
      background: conic-gradient(
        from 0deg,
        transparent 0deg 38deg,
        color-mix(in srgb, var(--flow-accent) 36%, transparent) 62deg,
        var(--flow-accent) 88deg,
        color-mix(in srgb, var(--flow-accent) 36%, transparent) 114deg,
        transparent 138deg 218deg,
        color-mix(in srgb, var(--flow-accent) 36%, transparent) 242deg,
        var(--flow-accent) 268deg,
        color-mix(in srgb, var(--flow-accent) 36%, transparent) 294deg,
        transparent 318deg 360deg
      );
      transform: translateY(-50%) rotate(0turn); transform-origin: center;
      animation: analysis-border-flow 7.2s linear infinite;
    }
    .analysis-trigger::after {
      content: ""; position: absolute; inset: 2px; z-index: 1; border-radius: 1px;
      background: var(--primary); pointer-events: none;
    }
    .skill-card.is-active .analysis-trigger { display: flex; }
    .analysis-trigger span, .analysis-trigger svg { position: relative; z-index: 2; }
    .analysis-trigger svg { width: 16px; height: 16px; transition: transform 160ms ease; }
    .analysis-trigger:hover svg { transform: translateX(4px); }
    @keyframes analysis-border-flow {
      to { transform: translateY(-50%) rotate(1turn); }
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px; width: fit-content; min-height: 24px;
      padding: 0 8px; border: 1px solid currentColor; border-radius: 2px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .status-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .severity-critical { color: var(--critical); }
    .severity-high { color: var(--high); }
    .severity-medium { color: var(--warn); }
    .severity-low, .severity-info { color: var(--safe); }
    .severity-pending { color: var(--text-soft); }
    .taxonomy { display: grid; gap: 8px; align-content: start; }
    .taxonomy-empty { color: var(--text-faint); font-size: 12px; }
    .taxonomy-group {
      display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px;
      padding: 8px; border-left: 2px solid currentColor; border-radius: 2px;
    }
    .taxonomy-label { font-size: 11px; font-weight: 700; line-height: 1.55; }
    .taxonomy-values { display: flex; flex-wrap: wrap; gap: 8px 16px; min-width: 0; }
    .taxonomy-value { color: var(--text); font-size: 11px; line-height: 1.55; overflow-wrap: anywhere; }
    .taxonomy-value + .taxonomy-value::before { content: "/"; margin-right: 8px; color: currentColor; opacity: .45; }
    .taxonomy-data { color: var(--data); background: var(--data-soft); }
    .taxonomy-integrity { color: var(--integrity); background: var(--integrity-soft); }
    .taxonomy-human { color: var(--human); background: var(--human-soft); }
    .taxonomy-commerce { color: var(--commerce); background: var(--commerce-soft); }
    .taxonomy-other { color: var(--other); background: var(--other-soft); }
    .empty-results { padding: 48px 16px; color: var(--text-soft); text-align: center; }
    .drawer-scrim {
      position: fixed; inset: 0; z-index: 40; border: 0; border-radius: 0;
      background: rgba(5, 13, 20, .48); opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 160ms ease, visibility 160ms ease;
    }
    .drawer-scrim.is-open { opacity: 1; visibility: visible; pointer-events: auto; }
    .analysis-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; height: 100vh; height: 100dvh;
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto; width: min(480px, 100vw);
      border-left: 1px solid var(--line); background: var(--surface); box-shadow: -16px 0 40px rgba(5, 13, 20, .18);
      transform: translateX(100%); visibility: hidden;
      transition: transform 240ms cubic-bezier(.2, .8, .2, 1), visibility 240ms ease;
    }
    .analysis-drawer.is-open { transform: translateX(0); visibility: visible; }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 64px; padding: 8px 16px; border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .drawer-kicker { display: block; margin-bottom: 0; color: var(--primary); font-size: 10px; font-weight: 750; letter-spacing: .08em; }
    .drawer-close {
      display: grid; place-items: center; width: 32px; height: 32px; padding: 0;
      border-color: var(--line-strong); background: var(--surface-soft);
    }
    .drawer-close:hover { border-color: var(--primary); color: var(--primary); }
    .drawer-close svg { width: 16px; height: 16px; }
    .detail { min-height: 0; padding: 24px; overflow: auto; overscroll-behavior: contain; }
    .detail-empty { padding: 40px 16px; color: var(--text-faint); text-align: center; line-height: 1.6; }
    .detail h2 { margin-bottom: 8px; font-size: 21px; overflow-wrap: anywhere; }
    .detail-description { color: var(--text-soft); font-size: 13px; line-height: 1.6; }
    .detail-status { display: grid; gap: 8px; margin: 16px 0; }
    .decision-row {
      display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: baseline;
      padding: 8px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface-soft);
    }
    .decision-label { color: var(--text-faint); font-size: 11px; font-weight: 650; }
    .decision-value { font-size: 12px; font-weight: 650; }
    .review-status {
      display: flex; align-items: flex-start; gap: 8px; padding: 8px;
      border: 1px solid var(--line); border-radius: 2px; font-size: 12px; line-height: 1.5;
    }
    .review-status svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; }
    .review-status strong { display: block; font-size: 12px; }
    .review-status small { display: block; margin-top: 2px; color: var(--text-soft); font-size: 11px; }
    .review-status.is-confirmed { border-color: color-mix(in srgb, var(--safe) 48%, var(--line)); background: var(--safe-soft); color: var(--safe); }
    .review-status.is-pending { background: var(--surface-soft); color: var(--text-soft); }
    .conclusion {
      margin: 16px 0 8px; padding: 16px; border-left: 2px solid var(--primary);
      background: var(--primary-soft); font-size: 13px; line-height: 1.65;
    }
    .detail-taxonomy { margin: 16px 0; }
    .detail-section-title { margin: 24px 0 8px; color: var(--text-faint); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .finding { padding: 16px 0; border-top: 1px solid var(--line); }
    .finding h3 { margin-bottom: 8px; line-height: 1.45; }
    .finding p { margin-bottom: 8px; font-size: 13px; line-height: 1.62; }
    .finding-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--text-faint); font-size: 11px; line-height: 1.5; }
    .finding-meta span + span::before { content: "·"; margin-right: 16px; }
    .verification-state { color: var(--safe); font-weight: 700; }
    .verification-state svg { width: 12px; height: 12px; margin-right: 4px; vertical-align: -2px; }
    .external-site {
      display: grid; gap: 8px; margin: 16px 0 8px; padding: 16px;
      border: 1px solid var(--line); border-left: 2px solid var(--data); background: var(--data-soft);
    }
    .external-site h4 { margin: 0; color: var(--data); font-size: 12px; }
    .external-site dl { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 8px; margin: 0; }
    .external-site dt { color: var(--text-faint); font-size: 11px; }
    .external-site dd { margin: 0; font-size: 12px; overflow-wrap: anywhere; }
    .external-site-note { margin: 0 !important; color: var(--text-soft); font-size: 12px !important; }
    .drawer-action {
      padding: 16px 24px 24px; border-top: 1px solid var(--line); background: var(--surface);
    }
    .drawer-action button {
      width: 100%; min-height: 40px; padding: 8px 16px; border-color: var(--primary);
      background: var(--primary); color: light-dark(#fff, #0e1a24); font-weight: 700;
      transition: filter 160ms ease;
    }
    .drawer-action button:hover { filter: brightness(1.08); }
    .copy-toast {
      position: absolute; top: 50%; left: 50%; z-index: 5; width: min(calc(100% - 32px), 360px);
      display: flex; align-items: flex-start; gap: 8px; padding: 12px 16px;
      border: 1px solid color-mix(in srgb, var(--safe) 48%, var(--line)); border-radius: 2px;
      background: var(--surface); box-shadow: var(--shadow); color: var(--text);
      opacity: 0; transform: translate(-50%, calc(-50% + 8px)); pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .copy-toast.is-visible { opacity: 1; transform: translate(-50%, -50%); }
    .copy-toast svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 1px; color: var(--safe); }
    .copy-toast strong { display: block; margin-bottom: 2px; color: var(--safe); font-size: 12px; }
    .copy-toast span { display: block; color: var(--text-soft); font-size: 12px; line-height: 1.55; }
    .copy-toast.is-error { border-color: color-mix(in srgb, var(--warn) 48%, var(--line)); }
    .copy-toast.is-error svg, .copy-toast.is-error strong { color: var(--warn); }
    .relationship { overflow: hidden; }
    .graph-mode {
      display: inline-grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px;
      border: 1px solid var(--line); border-radius: 2px; background: var(--surface-soft);
    }
    .graph-mode button {
      min-height: 32px; padding: 4px 8px; border: 0; border-radius: 1px;
      background: transparent; color: var(--text-soft); font-size: 11px; font-weight: 700;
    }
    .graph-mode button:hover { color: var(--text); background: var(--surface); }
    .graph-mode button[aria-selected="true"] { color: var(--primary); background: var(--surface); box-shadow: 0 1px 4px rgba(23, 33, 43, .08); }
    .graph-view-actions {
      position: absolute; top: 16px; right: 16px; z-index: 2;
      display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line);
      border-radius: 2px; background: color-mix(in srgb, var(--surface) 94%, transparent);
      box-shadow: 0 4px 16px light-dark(rgba(23, 33, 43, .08), rgba(0, 0, 0, .18));
      backdrop-filter: blur(8px);
    }
    .graph-view-actions button {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      min-width: 28px; min-height: 28px; padding: 4px 8px; border: 0; border-radius: 1px;
      background: transparent; color: var(--text-soft); font-size: 10px; font-weight: 700;
    }
    .graph-view-actions svg { width: 14px; height: 14px; flex: 0 0 auto; }
    .graph-view-actions button:hover:not(:disabled) { color: var(--text); background: var(--surface-soft); }
    .graph-view-actions button[aria-pressed="true"] { color: var(--primary); background: var(--primary-soft); }
    .graph-view-actions button:disabled { opacity: .42; cursor: not-allowed; }
    .relationship-body { display: grid; grid-template-rows: minmax(352px, 1fr) auto auto; min-height: 560px; }
    .graph-stage { position: relative; display: grid; min-width: 0; overflow: hidden; background: var(--surface); }
    #graph { display: block; width: 100%; height: 456px; touch-action: none; cursor: grab; }
    #graph.is-panning { cursor: grabbing; }
    .graph-pan-hint {
      position: absolute; right: 16px; bottom: 12px; z-index: 2; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: 2px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      color: var(--text-faint); font-size: 9px; pointer-events: none;
    }
    .edge { fill: none; stroke: var(--line-strong); stroke-width: 1.25; opacity: .68; pointer-events: none; }
    .edge.active, .edge.is-focused { stroke: var(--primary); stroke-width: 2.25; opacity: 1; }
    .edge.dim { opacity: .12; }
    .edge-hit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
    .edge-label {
      fill: var(--text-faint); font-size: 9px; font-weight: 700; paint-order: stroke;
      stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; pointer-events: none;
    }
    .edge-hit:hover + .edge-label, .edge-hit:focus-visible + .edge-label { fill: var(--text); }
    .edge-label.is-focused { fill: var(--primary); }
    .node { cursor: pointer; transition: opacity 160ms ease; }
    .node circle { stroke: var(--surface); stroke-width: 2; }
    .node:hover text, .node:focus-visible text { fill: var(--primary); }
    .node .selection-ring { fill: none; stroke: var(--primary); stroke-width: 2; opacity: .9; }
    .node text {
      fill: var(--text); font-size: 11px; paint-order: stroke;
      stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: all;
    }
    .node .hit-area { fill: transparent; stroke: none; pointer-events: all; }
    .node.dim { opacity: .16; }
    .node.selected > circle:not(.hit-area):not(.selection-ring) { stroke: var(--primary); stroke-width: 4; }
    .node.is-focused > circle:not(.hit-area):not(.selection-ring) { stroke: var(--flow-accent); stroke-width: 4; }
    .node:focus-visible .hit-area { stroke: var(--primary); stroke-width: 2; }
    .graph-empty {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 32px;
      color: var(--text-faint); text-align: center; font-size: 12px; line-height: 1.6; pointer-events: none;
    }
    .graph-inspector {
      min-height: 152px; max-height: 360px; padding: 16px; overflow: auto;
      border-top: 1px solid var(--line); background: var(--surface-soft); outline: none;
    }
    .graph-inspector-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 12px;
    }
    .graph-inspector-kicker {
      display: block; margin-bottom: 4px; color: var(--primary); font-size: 10px;
      font-weight: 750; letter-spacing: .08em; text-transform: uppercase;
    }
    .graph-inspector h3 { margin: 0; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
    .graph-inspector-note { margin: 0; color: var(--text-soft); font-size: 12px; line-height: 1.6; }
    .graph-inspector-hint { color: var(--text-faint); font-size: 10px; white-space: nowrap; }
    .graph-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .graph-tag {
      display: inline-flex; align-items: center; min-height: 24px; padding: 2px 8px;
      border: 1px solid var(--line-strong); border-radius: 2px; background: var(--surface);
      color: var(--text-soft); font-size: 10px; font-weight: 700;
    }
    .graph-relation-stack { display: grid; gap: 12px; }
    .graph-pair { display: grid; gap: 8px; }
    .graph-pair + .graph-pair { padding-top: 12px; border-top: 1px solid var(--line); }
    .graph-pair > h4 { margin: 0; color: var(--text); font-size: 12px; line-height: 1.5; }
    .graph-relation-card { padding: 12px; border-left: 2px solid var(--primary); background: var(--surface); }
    .graph-relation-card h4 { margin: 0 0 6px; color: var(--primary); font-size: 11px; }
    .graph-relation-card p { margin: 0; color: var(--text-soft); font-size: 11px; line-height: 1.6; }
    .graph-relation-card dl {
      display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 12px;
      margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line);
    }
    .graph-relation-card dt { color: var(--text-faint); font-size: 10px; font-weight: 700; }
    .graph-relation-card dd { margin: 0; color: var(--text); font-size: 11px; line-height: 1.55; }
    .graph-evidence { margin-top: 10px; }
    .graph-evidence summary { width: fit-content; color: var(--primary); cursor: pointer; font-size: 10px; font-weight: 700; }
    .graph-evidence ul { display: grid; gap: 6px; margin: 8px 0 0; padding-left: 18px; }
    .graph-evidence li { color: var(--text-soft); font-size: 10px; line-height: 1.55; }
    .legend {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-content: start;
      gap: 8px 16px; padding: 16px; border-top: 1px solid var(--line); background: var(--surface-soft);
    }
    .legend-title { grid-column: 1 / -1; margin-bottom: 0; color: var(--text-faint); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .legend #graph-legend-items { display: contents; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; color: var(--text-soft); font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    @media (max-width: 1180px) {
      .results-layout, .results-layout.showing-relationships { grid-template-columns: 1fr; }
      #graph { height: 456px; }
    }
    @media (max-width: 1080px) {
      .skill-card-main { grid-template-columns: minmax(190px, .8fr) minmax(240px, 1.2fr); }
      .skill-card-main.has-recommendation { grid-template-columns: minmax(190px, .8fr) minmax(240px, 1.2fr); }
      .skill-card-main.has-recommendation .recommendation { grid-column: 1 / -1; display: grid; grid-template-columns: 88px 1fr; gap: 8px; }
    }
    @media (max-width: 860px) {
      .report-intro { display: block; }
      .intro-note { margin-top: 16px; }
      #graph { height: 384px; }
    }
    @media (min-width: 540px) and (max-width: 640px) {
      .app-header { position: static; padding: 8px 16px; }
      main { padding: 24px 16px 32px; }
      .report-intro h2 { font-size: 26px; }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .stat { padding-inline: 8px; border-top: 0; }
      .toolbar { grid-template-columns: 1fr; }
      input, .custom-select-trigger, .custom-select-option { min-height: 44px; }
      .skill-card-main { grid-template-columns: 1fr; gap: 16px; }
      .skill-card-main.has-recommendation { grid-template-columns: 1fr; }
      .skill-title-row { flex-wrap: wrap; }
      .skill-card-main.has-recommendation .recommendation { grid-column: auto; display: block; }
      .taxonomy-group { grid-template-columns: 80px minmax(0, 1fr); }
      .relationship .panel-head { align-items: stretch; flex-direction: column; }
      .relationship .panel-title { flex-wrap: wrap; }
      .graph-mode { width: 100%; }
      .graph-view-actions { top: 8px; right: 8px; }
      .graph-view-actions .button-label { display: none; }
      .graph-pan-hint { right: 8px; bottom: 8px; }
      .legend { grid-template-columns: 1fr 1fr; }
      #graph { height: 416px; }
      .graph-inspector { min-height: 176px; }
      .graph-inspector-head { display: block; }
      .graph-inspector-hint { display: block; margin-top: 8px; white-space: normal; }
      .graph-relation-card dl { grid-template-columns: 1fr; gap: 4px; }
      .analysis-drawer { width: 100vw; }
      .drawer-close { width: 44px; height: 44px; }
      .detail { padding: 16px; }
      .drawer-action { padding: 16px; }
      .detail-description, .finding p { font-size: 14px; }
      .drawer-action button { min-height: 44px; }
    }
    @media (min-width: 540px) and (max-height: 560px) and (orientation: landscape) {
      .app-header { position: static; }
      .analysis-drawer { width: min(520px, 72vw); }
      .drawer-head { min-height: 56px; }
      .detail { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .analysis-trigger::before { animation: none !important; background: color-mix(in srgb, var(--flow-accent) 48%, transparent); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 4.5 6.5v5.2c0 4.5 3 7.8 7.5 9.3 4.5-1.5 7.5-4.8 7.5-9.3V6.5L12 3Z"/>
            <path d="m8.7 12 2.1 2.1 4.6-4.6"/>
          </svg>
        </span>
        <h1>Wizz Skill Safekeeper</h1>
      </div>
    </header>
    <main>
      <section class="report-intro" aria-labelledby="report-title">
        <div>
          <div class="eyebrow">扫描报告</div>
          <h2 id="report-title">正在整理检查结果</h2>
        </div>
        <p class="intro-note" id="intro-note">选择一个 Skill 查看它的依赖，也可切换到 Skill 间关系图；点击 Skill 聚焦局部，点击连线查看已复核诊断。</p>
      </section>

      <section class="stats" aria-label="扫描摘要">
        <div class="stat"><span class="stat-label">已检查 Skill</span><strong id="skill-count">0</strong></div>
        <div class="stat"><span class="stat-label">高风险及以上</span><strong id="high-count">0</strong></div>
        <div class="stat"><span class="stat-label">扫描文件</span><strong id="file-count">0</strong></div>
      </section>

      <div class="results-layout">
        <section class="panel results-panel" aria-labelledby="results-title">
          <div class="panel-head">
            <div class="panel-title"><h2 id="results-title">扫描结果</h2><span class="count" id="visible-count"></span></div>
          </div>
          <div class="toolbar" aria-label="筛选扫描结果">
            <div class="field">
              <label for="search">查找 Skill</label>
              <input id="search" type="search" placeholder="名称、说明或风险标签">
            </div>
            <div class="field">
              <label id="severity-label" for="severity">最低风险</label>
              <div class="custom-select" id="severity-select" data-value="pending">
                <button type="button" class="custom-select-trigger" id="severity" aria-haspopup="listbox" aria-expanded="false" aria-controls="severity-menu" aria-labelledby="severity-label severity-value">
                  <span id="severity-value">全部</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
                </button>
                <div class="custom-select-menu" id="severity-menu" role="listbox" aria-labelledby="severity-label" hidden>
                  <button type="button" class="custom-select-option" role="option" data-value="pending" aria-selected="true"><span>全部</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
                  <button type="button" class="custom-select-option" role="option" data-value="medium" aria-selected="false"><span>中风险及以上</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
                  <button type="button" class="custom-select-option" role="option" data-value="high" aria-selected="false"><span>高风险及以上</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
                  <button type="button" class="custom-select-option" role="option" data-value="critical" aria-selected="false"><span>仅严重</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
                </div>
              </div>
            </div>
          </div>
          <div class="skill-list" id="skill-list"></div>
        </section>
        <section class="panel relationship" id="relationship-section" aria-labelledby="relationship-title">
          <div class="panel-head">
            <div class="panel-title"><h2 id="relationship-title">当前 Skill 的关联资源</h2><span class="count" id="graph-skill-name">随选择同步更新</span></div>
            <div class="graph-mode" role="tablist" aria-label="关系图显示方式">
              <button type="button" role="tab" id="graph-mode-dependencies" data-graph-mode="dependencies" aria-selected="true" aria-controls="graph">当前 Skill 依赖</button>
              <button type="button" role="tab" id="graph-mode-relationships" data-graph-mode="relationships" aria-selected="false" aria-controls="graph">Skill 间关系</button>
            </div>
          </div>
          <div class="relationship-body">
            <div class="graph-stage">
              <div class="graph-view-actions" id="graph-view-actions" aria-label="Skill 关系视角" hidden>
                <button type="button" data-graph-zoom="out" aria-label="缩小关系图" title="缩小">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg>
                </button>
                <button type="button" data-graph-zoom="in" aria-label="放大关系图" title="放大">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button type="button" data-graph-view="global" aria-pressed="true" aria-label="适应全部关系组">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg>
                  <span class="button-label">适应全图</span>
                </button>
                <button type="button" data-graph-view="group" aria-pressed="false" aria-label="聚焦当前选中的完整关系组">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
                  <span class="button-label">聚焦关系组</span>
                </button>
              </div>
              <svg id="graph" role="img" aria-label="当前 Skill 与其关联资源图"></svg>
              <div class="graph-pan-hint" id="graph-pan-hint" hidden>滚轮缩放 · 拖拽平移</div>
              <div class="graph-empty" id="graph-empty" hidden></div>
            </div>
            <aside class="graph-inspector" id="graph-inspector" aria-live="polite" aria-label="关系诊断"></aside>
            <div class="legend" aria-label="图例">
              <div class="legend-title">图例</div>
              <div id="graph-legend-items"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <button type="button" class="drawer-scrim" id="drawer-scrim" aria-label="关闭 Skill 详细分析" tabindex="-1"></button>
  <aside class="analysis-drawer" id="analysis-drawer" role="dialog" aria-modal="true" aria-labelledby="analysis-title" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <span class="drawer-kicker">详细分析</span>
        <h2 id="analysis-title">Skill 分析</h2>
      </div>
      <button type="button" class="drawer-close" id="drawer-close" aria-label="关闭详细分析">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <div class="detail" id="detail" aria-live="polite"><div class="detail-empty">选择一个 Skill 查看分析</div></div>
    <div class="drawer-action" id="drawer-action" hidden></div>
    <div class="copy-toast" id="copy-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
      <div><strong id="copy-toast-title">复核请求已复制</strong><span id="copy-toast-message">请回到对话窗口，粘贴并发送给 Agent 继续复核。</span></div>
    </div>
  </aside>
  <script>
    "use strict";
    const report = __WIZZ_SKILL_KEEPER_REPORT__;
    const severityRank = {pending: -1, info: 0, low: 1, medium: 2, high: 3, critical: 4};
    const recommendationText = {
      keep: "可以继续使用，无需额外调整。",
      "keep-with-notice": "可以继续使用；在首次发生联网、读取敏感信息或产生费用前，用通俗文字告知用户。",
      "require-confirmation": "继续使用前，在发送数据、访问账号、产生费用或修改内容的当下再次询问用户。",
      restrict: "先缩小可访问的数据、站点、账号密钥和费用额度，再继续使用。",
      "explicit-only": "关闭自动触发；只在用户明确点名这个 Skill 时运行。",
      isolate: "暂时停止日常使用，确认并修复已发现的有害路径后再恢复。",
      uninstall: "停止使用并移除；如曾使用账号密钥，还应更换相关密钥。",
      "agent-review": "扫描已完成，需要 Agent 结合原文和代码上下文形成最终结论。"
    };
    const severityText = {
      info: "未见明显风险", low: "低风险", medium: "中风险",
      high: "高风险", critical: "严重风险", pending: "待 Agent 核验"
    };
    const confidenceText = {heuristic: "初步判断", probable: "较可信", confirmed: "证据充分", pending: "待核验"};
    const tagText = {
      "external-data-transfer": "数据可能发往外部站点", "credential-access": "访问账号密钥",
      "broad-file-access": "广泛读取文件", "unsafe-url-fetch": "不受限网址访问",
      "silent-telemetry": "未明示的数据采集", "arbitrary-code-execution": "执行任意代码",
      "content-rendering-boundary": "内容渲染边界", "unsafe-content-rendering": "内容注入已确认",
      "destructive-action": "破坏性操作", "obfuscated-behavior": "行为经过隐藏",
      "supply-chain-risk": "供应链风险", "documentation-mismatch": "文档与行为不一致",
      "scope-hijack": "偏离用户目标", "priority-escalation": "提升自身优先级",
      "instruction-conflict": "指令冲突", "authorization-overreach": "超出授权范围",
      "disclosure-suppression": "压制风险披露", "delayed-disclosure": "延后披露",
      "authority-imitation": "模仿权威身份", "manipulative-commerce": "商业诱导",
      "policy-evasion": "规避规则", "cognitive-overload": "制造认知负担",
      "paid-operation": "可能产生费用", "unverified-claims": "未经验证的声明"
    };
    const siteScaleText = {unknown: "暂不清楚", small: "小型", medium: "中型", large: "大型"};
    const siteRecognitionText = {unknown: "暂不清楚", niche: "小众或专业领域", regional: "区域性知名", "widely-known": "广为人知"};
    const siteSafetyText = {
      "not-reviewed": "本次未完成站点安全评价",
      "no-material-concern-found": "暂未发现明显问题",
      "concerns-found": "发现需要关注的问题"
    };
    const tagDimensions = [
      {key: "data", label: "数据与权限", tags: new Set(["external-data-transfer", "credential-access", "broad-file-access", "unsafe-url-fetch", "silent-telemetry"])},
      {key: "integrity", label: "执行与完整性", tags: new Set(["arbitrary-code-execution", "content-rendering-boundary", "unsafe-content-rendering", "destructive-action", "obfuscated-behavior", "supply-chain-risk", "documentation-mismatch"])},
      {key: "human", label: "提示与交互", tags: new Set(["scope-hijack", "priority-escalation", "instruction-conflict", "authorization-overreach", "disclosure-suppression", "delayed-disclosure", "authority-imitation", "manipulative-commerce", "policy-evasion", "cognitive-overload"])},
      {key: "commerce", label: "费用与承诺", tags: new Set(["paid-operation", "unverified-claims"])},
    ];
    const state = {
      selected: null, query: "", severity: "pending", graphMode: "dependencies",
      relationshipView: "global", relationshipGroupKey: null, graphPinnedKey: null, drawerOpen: false
    };
    const byId = new Map(report.skills.map(function(skill) { return [skill.id, skill]; }));
    const graph = report.graph || {status: "pending-agent-review", nodes: [], edges: []};
    const svg = document.getElementById("graph");
    const graphPanHint = document.getElementById("graph-pan-hint");
    const graphCamera = {x: 0, y: 0, k: 1, min: .42, max: 2.8, dragging: false, pointerId: null};
    let graphViewport = null;
    let graphLayoutState = null;
    let graphCameraFrame = 0;
    const shell = document.querySelector(".shell");
    const drawer = document.getElementById("analysis-drawer");
    const drawerScrim = document.getElementById("drawer-scrim");
    const drawerClose = document.getElementById("drawer-close");
    const drawerAction = document.getElementById("drawer-action");
    const copyToast = document.getElementById("copy-toast");
    let copyToastTimer = 0;
    const severitySelect = setupCustomSelect(document.getElementById("severity-select"), function(value) {
      state.severity = value; applyFilters();
    });
    document.querySelectorAll("[data-graph-mode]").forEach(function(button) {
      button.addEventListener("click", function() {
        state.graphMode = button.dataset.graphMode;
        if (state.graphMode === "relationships") {
          state.relationshipView = "global";
          state.relationshipGroupKey = null;
        }
        state.graphPinnedKey = null;
        document.querySelectorAll("[data-graph-mode]").forEach(function(item) {
          item.setAttribute("aria-selected", item === button ? "true" : "false");
        });
        drawGraph();
      });
    });
    document.querySelectorAll("[data-graph-view]").forEach(function(button) {
      button.addEventListener("click", function() {
        if (button.disabled) return;
        if (button.dataset.graphView === "group") focusRelationshipGroup(true);
        else fitGlobalRelationshipGraph(true);
      });
    });
    document.querySelectorAll("[data-graph-zoom]").forEach(function(button) {
      button.addEventListener("click", function() {
        if (button.disabled || state.graphMode !== "relationships") return;
        zoomGraphAt(svg.clientWidth / 2, svg.clientHeight / 2, button.dataset.graphZoom === "in" ? 1.22 : 1 / 1.22);
      });
    });
    svg.addEventListener("wheel", function(event) {
      if (state.graphMode !== "relationships" || !graphViewport) return;
      event.preventDefault();

    function buildGraphModel() {
      const nodeMap = new Map(graph.nodes.map(function(node) { return [node.id, node]; }));
      const center = graph.nodes.find(function(node) {
        return node.type === "skill" && graphSkillId(node) === state.selected;
      });
      if (state.graphMode === "relationships") {
        const allPairs = buildRelationshipPairs(nodeMap);
        const relatedIds = new Set();
        allPairs.forEach(function(pair) { relatedIds.add(pair.source.id); relatedIds.add(pair.target.id); });
        const allNodes = Array.from(relatedIds).map(function(id) { return nodeMap.get(id); }).filter(Boolean);
        const components = buildRelationshipComponents(allNodes, allPairs);
        components.forEach(function(component) {
          component.pairs.forEach(function(pair) { pair.groupKey = component.key; });
        });
        const selectedComponent = center ? components.find(function(component) {
          return component.nodes.some(function(node) { return node.id === center.id; });
        }) : null;
        const requestedComponent = components.find(function(component) { return component.key === state.relationshipGroupKey; });
        const activeComponent = requestedComponent || selectedComponent || components[0] || null;
        if (activeComponent && !state.relationshipGroupKey) state.relationshipGroupKey = activeComponent.key;
        return {
          mode: "relationships", view: state.relationshipView, center: center || null, nodes: allNodes, items: allPairs,
          components: components, activeComponent: activeComponent, totalGroupCount: components.length,
          relationshipCount: allPairs.reduce(function(total, item) { return total + item.edges.length; }, 0)
        };
      }
      if (!center) return {mode: "dependencies", center: null, nodes: [], items: []};
      const items = [];
      graph.edges.forEach(function(edge, index) {
        if (edge.source !== center.id && edge.target !== center.id) return;
        const neighborId = edge.source === center.id ? edge.target : edge.source;
        const neighbor = nodeMap.get(neighborId);
        if (!neighbor || neighbor.type === "skill") return;
        items.push({key: "dependency:" + neighborId + ":" + index, kind: "dependency", source: center, target: neighbor, neighbor: neighbor, edge: edge});
      });
      items.sort(function(a, b) { return graphNodeLabel(a.neighbor).localeCompare(graphNodeLabel(b.neighbor), "zh-CN"); });
      return {mode: "dependencies", center: center, nodes: [center].concat(items.map(function(item) { return item.neighbor; })), items: items};
    }

    function renderGraphOverview(model) {
      const selectedSkill = state.selected ? byId.get(state.selected) : null;
      const selectedName = selectedSkill ? selectedSkill.name : "当前 Skill";
      if (model.mode === "dependencies" && !model.center) {
        graphInspector.innerHTML = '<div class="graph-inspector-head"><div><span class="graph-inspector-kicker">关系诊断</span>' +
          '<h3>请先从扫描结果中选择一个 Skill</h3></div></div>' +
          '<p class="graph-inspector-note">选择后，这里会随图中的节点和连线展示关联资源或 Agent 已复核的 Skill 间关系。</p>';
        return;
      }
      if (model.mode === "relationships") {
        const heading = model.view === "group" ? "已聚焦当前关系组" : "全部已复核关系";
        const summary = "一个连续关系网络呈现 " + model.totalGroupCount + " 个关系组、" + model.nodes.length + " 个 Skill、" + model.items.length +
          " 对关联和 " + model.relationshipCount + " 条 Agent 已复核关系。" +
          (model.view === "group" ? " 当前镜头聚焦整个关系组，其他关系组仍保留在画布中。" : " 可滚轮缩放、拖拽平移，或选择连线后聚焦其所属关系组。");
        graphInspector.innerHTML = '<div class="graph-inspector-head"><div><span class="graph-inspector-kicker">Skill 间关系</span>' +
          '<h3>' + escapeHtml(heading) + '</h3></div><span class="graph-inspector-hint">点击选择并查看</span></div>' +
          '<p class="graph-inspector-note">' + summary + ' 点击节点或连线只会更新这里的关系诊断，不会切换主图。</p>';
      } else {
        graphInspector.innerHTML = '<div class="graph-inspector-head"><div><span class="graph-inspector-kicker">当前 Skill 依赖</span>' +
          '<h3>' + escapeHtml(selectedName) + '</h3></div><span class="graph-inspector-hint">点击选择并查看</span></div>' +
          '<p class="graph-inspector-note">当前显示 ' + model.items.length +
          ' 个直接关联资源。选择节点或连线可查看资源类型与连接方式。</p>';
      }
    }

    function renderGraphInspector(model, item, pinned) {
      if (!item) { renderGraphOverview(model); return; }
      const selectedSkill = byId.get(state.selected);
      const selectedName = selectedSkill ? selectedSkill.name : (model.center ? graphNodeLabel(model.center) : "当前 Skill");
      const neighborName = item.neighbor ? graphNodeLabel(item.neighbor) : "关联对象";
      if (model.mode === "dependencies") {
        const connection = dependencyTypeText[item.edge.type] || item.edge.type.replace(/-/g, " ");
        const resourceType = resourceTypeText[item.neighbor.type] || "关联资源";
        graphInspector.innerHTML = '<div class="graph-inspector-head"><div><span class="graph-inspector-kicker">' + escapeHtml(resourceType) + '</span>' +
          '<h3>' + escapeHtml(neighborName) + '</h3></div><span class="graph-inspector-hint">' + (pinned ? "已固定" : "点击查看") + '</span></div>' +
          '<div class="graph-tags"><span class="graph-tag">' + escapeHtml(connection) + '</span></div>' +
          '<p class="graph-inspector-note">' + escapeHtml(selectedName) + ' 会通过“' + escapeHtml(connection) + '”与此资源发生连接。' +
          (pinned ? "再次选择其他节点或连线可切换详情。" : "点击节点或连线可将此说明固定在这里。") + '</p>';

      }
      if (item.kind === "relationship-node") {
        const relationTypes = Array.from(new Set(item.incident.reduce(function(types, pair) {

        }, [])));

        }).join("");

          '<div class="graph-tags">' + relationTypes.map(function(type) { return '<span class="graph-tag">' + escapeHtml(type) + '</span>'; }).join("") + '</div>' +
          '<p class="graph-inspector-note">以下是该 Skill 已完成 Agent 复核的直接关系。主图保持当前视角，仅更新本区域。</p>' +
          '<div class="graph-relation-stack">' + relationshipCards + '</div>';
        return;
      }
      graphInspector.innerHTML = '<div class="graph-inspector-head"><div><span class="graph-inspector-kicker">Skill 间关系</span>' +
        '<h3>' + escapeHtml(graphNodeLabel(item.source)) + ' ↔ ' + escapeHtml(graphNodeLabel(item.target)) + '</h3></div><span class="graph-inspector-hint">' +
        (pinned ? "已固定" : "点击查看") + '</span></div><div class="graph-tags">' +
        item.edges.map(function(edge) { return '<span class="graph-tag">' + escapeHtml(relationshipTypeText[edge.type]) + '</span>'; }).join("") +
        '</div><div class="graph-relation-stack">' + renderRelationshipPair(item, false) + '</div>';
    }

    function renderRelationshipPair(pair, includeHeading) {
      const sourceName = graphNodeLabel(pair.source);
      const targetName = graphNodeLabel(pair.target);
      const cards = pair.edges.map(function(edge) {
        const evidence = edge.evidence.map(function(entry) {
          const skill = byId.get(entry.skillId);
          const owner = skill ? skill.name : "关联 Skill";
          const location = entry.location ? " · " + entry.location : "";
          return '<li><strong>' + escapeHtml(owner) + '</strong>' + escapeHtml(location) + '：' + escapeHtml(entry.basis) + '</li>';
        }).join("");
        return '<article class="graph-relation-card"><h4>' + escapeHtml(relationshipTypeText[edge.type]) + ' · ' +
          escapeHtml(confidenceText[edge.confidence] || edge.confidence) + '</h4><p>' + escapeHtml(edge.summary) + '</p>' +
          '<dl><dt>Agent 诊断</dt><dd>' + escapeHtml(edge.diagnosis) + '</dd>' +
          '<dt>处理建议</dt><dd>' + escapeHtml(edge.recommendation) + '</dd></dl>' +
          '<details class="graph-evidence"><summary>查看双方复核依据（' + edge.evidence.length + '）</summary><ul>' + evidence + '</ul></details></article>';
      }).join("");
      const heading = includeHeading
        ? '<h4>' + escapeHtml(sourceName) + ' ↔ ' + escapeHtml(targetName) + '</h4>'
        : "";
      return '<section class="graph-pair">' + heading + cards + '</section>';
    }

    function svgElement(name, attributes) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.keys(attributes || {}).forEach(function(key) { element.setAttribute(key, attributes[key]); });
      return element;
    }

    function updateGraphViewControls() {
      document.querySelectorAll("[data-graph-view]").forEach(function(button) {
        button.setAttribute("aria-pressed", button.dataset.graphView === state.relationshipView ? "true" : "false");
        button.disabled = button.dataset.graphView === "group" && (!graphLayoutState || !graphLayoutState.groups.some(function(group) {
          return group.key === state.relationshipGroupKey;
        }));
      });
      document.querySelectorAll("[data-graph-zoom]").forEach(function(button) {
        button.disabled = !graphViewport || (button.dataset.graphZoom === "in" ? graphCamera.k >= graphCamera.max - .01 : graphCamera.k <= graphCamera.min + .01);
      });
    }

    function applyGraphCamera() {
      if (!graphViewport) return;
      graphViewport.setAttribute("transform", "translate(" + graphCamera.x + " " + graphCamera.y + ") scale(" + graphCamera.k + ")");
      updateGraphViewControls();
    }

    function cameraForBounds(bounds, maxScale) {
      const width = Math.max(320, svg.clientWidth), height = Math.max(320, svg.clientHeight);
      const padding = 48;
      const scale = Math.max(graphCamera.min, Math.min(graphCamera.max, maxScale,
        Math.min((width - padding * 2) / Math.max(1, bounds.width), (height - padding * 2) / Math.max(1, bounds.height))));
      return {
        x: width / 2 - (bounds.x + bounds.width / 2) * scale,
        y: height / 2 - (bounds.y + bounds.height / 2) * scale,
        k: scale
      };
    }

    function moveGraphCamera(target, animate) {
      window.cancelAnimationFrame(graphCameraFrame);
      const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!animate || reducedMotion) {
        graphCamera.x = target.x; graphCamera.y = target.y; graphCamera.k = target.k;
        applyGraphCamera(); return;
      }
      const start = {x: graphCamera.x, y: graphCamera.y, k: graphCamera.k};
      const startedAt = performance.now();
      function step(now) {
        const progress = Math.min(1, (now - startedAt) / 280);
        const eased = 1 - Math.pow(1 - progress, 3);
        graphCamera.x = start.x + (target.x - start.x) * eased;
        graphCamera.y = start.y + (target.y - start.y) * eased;
        graphCamera.k = start.k + (target.k - start.k) * eased;
        applyGraphCamera();
        if (progress < 1) graphCameraFrame = window.requestAnimationFrame(step);
      }
      graphCameraFrame = window.requestAnimationFrame(step);
    }

    function fitGlobalRelationshipGraph(animate) {
      if (!graphLayoutState) return;
      state.relationshipView = "global";
      moveGraphCamera(cameraForBounds(graphLayoutState.globalBounds, 1), animate);
    }

    function focusRelationshipGroup(animate) {
      if (!graphLayoutState) return;
      const group = graphLayoutState.groups.find(function(item) { return item.key === state.relationshipGroupKey; });
      if (!group) return;
      state.relationshipView = "group";
      moveGraphCamera(cameraForBounds(group.bounds, 1.75), animate);
    }

    function zoomGraphAt(x, y, factor) {
      if (!graphViewport) return;
      window.cancelAnimationFrame(graphCameraFrame);
      const nextScale = Math.max(graphCamera.min, Math.min(graphCamera.max, graphCamera.k * factor));
      const worldX = (x - graphCamera.x) / graphCamera.k;
      const worldY = (y - graphCamera.y) / graphCamera.k;
      graphCamera.x = x - worldX * nextScale;
      graphCamera.y = y - worldY * nextScale;
      graphCamera.k = nextScale;
      state.relationshipView = "custom";
      applyGraphCamera();
    }

    function clusteredRelationshipLayout(model, width, height) {
      const positions = new Map(), paths = new Map(), labelPoints = new Map(), groups = [];
      const canvasCenter = {x: width / 2, y: height / 2};
      const satelliteCount = Math.max(0, model.components.length - 1);
      model.components.forEach(function(component, componentIndex) {
        const featured = componentIndex === 0;
        let centerX = canvasCenter.x, centerY = canvasCenter.y;
        if (!featured) {
          const angle = -Math.PI / 2 + Math.PI * 2 * (componentIndex - 1) / Math.max(1, satelliteCount);
          centerX += Math.cos(angle) * width * .34;
          centerY += Math.sin(angle) * height * .32;
        }
        const degrees = new Map(component.nodes.map(function(node) { return [node.id, 0]; }));
        component.pairs.forEach(function(pair) { degrees.set(pair.source.id, degrees.get(pair.source.id) + 1); degrees.set(pair.target.id, degrees.get(pair.target.id) + 1); });
        const selected = component.nodes.find(function(node) { return graphSkillId(node) === state.selected; });
        const anchor = selected || component.nodes.slice().sort(function(a, b) {
          return degrees.get(b.id) - degrees.get(a.id) || graphNodeLabel(a).localeCompare(graphNodeLabel(b), "zh-CN");
        })[0];
        const others = component.nodes.filter(function(node) { return node.id !== anchor.id; });
        positions.set(anchor.id, {x: centerX, y: centerY, anchor: true});
        const radiusX = featured ? Math.min(180, width * .15) : Math.min(104, width * .085);
        const radiusY = featured ? Math.min(132, height * .19) : Math.min(76, height * .11);
        if (others.length === 1) {
          positions.set(anchor.id, {x: centerX - radiusX * .62, y: centerY, anchor: true});
          positions.set(others[0].id, {x: centerX + radiusX * .62, y: centerY, anchor: false});
        } else {
          others.forEach(function(node, index) {
            const angle = -Math.PI / 2 + (Math.PI * 2 * index / Math.max(1, others.length));
            positions.set(node.id, {x: centerX + Math.cos(angle) * radiusX, y: centerY + Math.sin(angle) * radiusY, anchor: false});
          });
        }
        const componentPositions = component.nodes.map(function(node) { return positions.get(node.id); });
        const minX = Math.min.apply(null, componentPositions.map(function(position) { return position.x; }));
        const maxX = Math.max.apply(null, componentPositions.map(function(position) { return position.x; }));
        const minY = Math.min.apply(null, componentPositions.map(function(position) { return position.y; }));
        const maxY = Math.max.apply(null, componentPositions.map(function(position) { return position.y; }));
        const padX = featured ? 112 : 88, padY = featured ? 88 : 72;
        groups.push({
          key: component.key, count: component.nodes.length,
          bounds: {x: minX - padX, y: minY - padY, width: maxX - minX + padX * 2, height: maxY - minY + padY * 2}
        });
        component.pairs.forEach(function(pair) {
          const source = positions.get(pair.source.id), target = positions.get(pair.target.id);
          if (pair.source.id === anchor.id || pair.target.id === anchor.id || component.nodes.length <= 2) {
            paths.set(pair.key, "M " + source.x + " " + source.y + " L " + target.x + " " + target.y);
            const dx = target.x - source.x, dy = target.y - source.y;
            const length = Math.hypot(dx, dy) || 1;
            labelPoints.set(pair.key, {
              x: (source.x + target.x) / 2 - dy / length * 12,
              y: (source.y + target.y) / 2 + dx / length * 12 - 4
            });
            return;
          }
          const midX = (source.x + target.x) / 2, midY = (source.y + target.y) / 2;
          let vectorX = midX - centerX, vectorY = midY - centerY;
          const length = Math.hypot(vectorX, vectorY) || 1;
          if (length < 10) { vectorX = -(target.y - source.y); vectorY = target.x - source.x; }
          const vectorLength = Math.hypot(vectorX, vectorY) || 1;
          const controlX = midX + vectorX / vectorLength * 40, controlY = midY + vectorY / vectorLength * 32;
          paths.set(pair.key, "M " + source.x + " " + source.y + " Q " + controlX + " " + controlY + " " + target.x + " " + target.y);
          labelPoints.set(pair.key, {x: (source.x + 2 * controlX + target.x) / 4, y: (source.y + 2 * controlY + target.y) / 4 - 6});
        });
      });
      const minGroupX = Math.min.apply(null, groups.map(function(group) { return group.bounds.x; }));
      const minGroupY = Math.min.apply(null, groups.map(function(group) { return group.bounds.y; }));
      const maxGroupX = Math.max.apply(null, groups.map(function(group) { return group.bounds.x + group.bounds.width; }));
      const maxGroupY = Math.max.apply(null, groups.map(function(group) { return group.bounds.y + group.bounds.height; }));
      return {
        positions: positions, paths: paths, labelPoints: labelPoints, groups: groups,
        globalBounds: {x: minGroupX, y: minGroupY, width: maxGroupX - minGroupX, height: maxGroupY - minGroupY}
      };
    }

    function drawGraph() {
      const model = buildGraphModel();
      const relationshipViewActions = document.getElementById("graph-view-actions");
      const resultsLayout = document.querySelector(".results-layout");
      const showingRelationships = model.mode === "relationships";
      relationshipViewActions.hidden = !showingRelationships;
      graphPanHint.hidden = !showingRelationships;
      resultsLayout.classList.toggle("showing-relationships", showingRelationships);
      resultsLayout.classList.toggle("relationships-wide", showingRelationships && model.totalGroupCount > 3);
      const width = Math.max(320, svg.clientWidth);
      if (model.mode === "relationships") {
        const relationshipHeight = model.totalGroupCount > 3 ? 640 : 560;
        svg.style.height = relationshipHeight + "px";
      } else {
        svg.style.height = "456px";
      }
      const height = Math.max(320, svg.clientHeight);
      svg.innerHTML = "";
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      graphViewport = null;
      graphLayoutState = null;
      const selectedSkill = state.selected ? byId.get(state.selected) : null;
      if (model.mode === "relationships") {
        document.getElementById("relationship-title").textContent = "Skill 间关系";
        document.getElementById("graph-skill-name").textContent = model.totalGroupCount + " 个关系组 · " + model.nodes.length + " 个 Skill · " + model.items.length + " 对关联";
        document.getElementById("graph-legend-items").innerHTML =
          '<span><i class="dot" style="background:var(--safe)"></i>当前选中</span>' +
          '<span><i class="dot" style="background:var(--primary)"></i>Skill 节点</span>' +
          '<span><i class="dot" style="background:var(--line-strong)"></i>一对或多种已复核关系</span>';
        svg.setAttribute("aria-label", "可缩放、拖拽的全部 Agent 已复核 Skill 关系图");
      } else {
        document.getElementById("relationship-title").textContent = "当前 Skill 的关联资源";
        document.getElementById("graph-skill-name").textContent = selectedSkill ? selectedSkill.name : "请先选择一个 Skill";
        document.getElementById("graph-legend-items").innerHTML =
          '<span><i class="dot" style="background:var(--safe)"></i>当前 Skill</span>' +
          '<span><i class="dot" style="background:var(--data)"></i>外部站点</span>' +
          '<span><i class="dot" style="background:var(--human)"></i>账号密钥</span>';
        svg.setAttribute("aria-label", selectedSkill ? selectedSkill.name + " 与其关联资源图" : "当前 Skill 与其关联资源图");
      }
      const missingCenter = model.mode === "dependencies" && !model.center;
      if (missingCenter || !model.items.length) {
        graphEmpty.hidden = false;
        graphEmpty.textContent = missingCenter ? "请从左侧选择一个 Skill" :
          (model.mode === "relationships" ? "当前没有 Agent 已复核的 Skill 间关系" : "当前 Skill 没有已确认的关联资源");
        state.graphPinnedKey = null;
        updateGraphViewControls();
        renderGraphOverview(model);
        return;
      }
      graphEmpty.hidden = true;
      let positions = new Map(), paths = new Map(), labelPoints = new Map(), groups = [];
      let layoutWidth = width, layoutHeight = height;
      let globalBounds = {x: 0, y: 0, width: layoutWidth, height: layoutHeight};
      if (model.mode === "relationships") {
        layoutWidth = Math.max(width, model.totalGroupCount > 3 ? 1360 : 960);
        layoutHeight = model.totalGroupCount > 3 ? 760 : 640;
        const layout = clusteredRelationshipLayout(model, layoutWidth, layoutHeight);
        positions = layout.positions;
        paths = layout.paths;
        labelPoints = layout.labelPoints;
        groups = layout.groups;
        globalBounds = layout.globalBounds;
      } else {
        const centerPosition = {x: Math.max(72, width * .24), y: height / 2, anchor: true};
        positions.set(model.center.id, centerPosition);
        const verticalGap = Math.min(80, (height - 64) / Math.max(1, model.items.length));
        const totalHeight = verticalGap * Math.max(0, model.items.length - 1);
        const startY = height / 2 - totalHeight / 2;
        const neighborX = Math.max(centerPosition.x + 116, Math.min(width - 136, width * .72));
        model.items.forEach(function(item, index) {
          positions.set(item.neighbor.id, {x: neighborX, y: startY + index * verticalGap, anchor: false});
          paths.set(item.key, "M " + centerPosition.x + " " + centerPosition.y + " L " + neighborX + " " + (startY + index * verticalGap));
          labelPoints.set(item.key, {x: (centerPosition.x + neighborX) / 2, y: (centerPosition.y + startY + index * verticalGap) / 2 - 6});
        });
      }
      const itemMap = new Map(model.items.map(function(item) { return [item.key, item]; }));
      if (model.mode === "relationships") {
        model.nodes.forEach(function(node) {
          const incident = model.items.filter(function(pair) { return pair.source.id === node.id || pair.target.id === node.id; });
          const component = model.components.find(function(group) {
            return group.nodes.some(function(groupNode) { return groupNode.id === node.id; });
          });
          itemMap.set("node:" + node.id, {
            key: "node:" + node.id, kind: "relationship-node", node: node, incident: incident,
            groupKey: component ? component.key : null
          });
        });
      }
      if (state.graphPinnedKey && !itemMap.has(state.graphPinnedKey)) state.graphPinnedKey = null;
      graphViewport = svgElement("g", {class: "graph-viewport"});
      const edgeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      graphViewport.append(edgeGroup, nodeGroup);
      svg.append(graphViewport);
      if (model.mode === "relationships") {
        graphLayoutState = {
          groups: groups,
          globalBounds: globalBounds
        };
      }
      const edgeVisuals = [], nodeVisuals = new Map();
      let displayedKey = "__unset__";
      let displayedPinned = null;

      function bindInteraction(element, key) {
        element.setAttribute("role", "button");
        element.setAttribute("tabindex", "0");
        element.setAttribute("aria-pressed", "false");
        element.addEventListener("click", function() {
          const selectedItem = itemMap.get(key);
          if (selectedItem && selectedItem.groupKey) state.relationshipGroupKey = selectedItem.groupKey;
          state.graphPinnedKey = key; applyFocus(key, true); updateGraphViewControls();
        });
        element.addEventListener("keydown", function(event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            const selectedItem = itemMap.get(key);
            if (selectedItem && selectedItem.groupKey) state.relationshipGroupKey = selectedItem.groupKey;
            state.graphPinnedKey = key; applyFocus(key, true); updateGraphViewControls();
          }
        });
      }

      model.items.forEach(function(item) {
        const labelText = model.mode === "relationships"
          ? item.edges.map(function(edge) { return relationshipTypeText[edge.type]; }).join(" / ")
          : (dependencyTypeText[item.edge.type] || item.edge.type.replace(/-/g, " "));
        const line = svgElement("path", {class: "edge", d: paths.get(item.key)});
        const hit = svgElement("path", {class: "edge-hit", d: paths.get(item.key)});
        hit.setAttribute("aria-label", graphNodeLabel(item.source) + " 与 " + graphNodeLabel(item.target) + "：" + labelText);
        hit.setAttribute("title", labelText);
        const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = labelText; hit.appendChild(title);
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("class", "edge-label");
        label.setAttribute("x", labelPoints.get(item.key).x);
        label.setAttribute("y", labelPoints.get(item.key).y);
        label.setAttribute("text-anchor", "middle");
        const compactLabel = model.mode === "relationships" && item.edges.length > 1
          ? relationshipTypeText[item.edges[0].type] + " +" + (item.edges.length - 1)
          : labelText;
        label.textContent = compactLabel.length > 18 ? compactLabel.slice(0, 17) + "…" : compactLabel;
        const labelTitle = document.createElementNS("http://www.w3.org/2000/svg", "title");
        labelTitle.textContent = labelText; label.appendChild(labelTitle);
        edgeGroup.append(line, hit, label);
        bindInteraction(hit, item.key);
        edgeVisuals.push({key: item.key, sourceId: item.source.id, targetId: item.target.id, line: line, hit: hit, label: label});
      });

      function createNode(node, itemKey) {
        const position = positions.get(node.id);
        const selected = graphSkillId(node) === state.selected;
        const dominant = model.mode !== "relationships" ? node.id === model.center.id : selected;
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const fullLabel = graphNodeLabel(node);
        const visibleLimit = model.mode === "relationships" ? 18 : 28;
        const visibleLabel = fullLabel.length > visibleLimit ? fullLabel.slice(0, visibleLimit - 1) + "…" : fullLabel;
        group.setAttribute("class", "node" + (selected ? " selected" : ""));
        group.setAttribute("transform", "translate(" + position.x + "," + position.y + ")");
        group.setAttribute("aria-label", (selected ? "当前选中 Skill：" : "Skill：") + fullLabel);
        group.setAttribute("title", fullLabel);
        const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = fullLabel; group.appendChild(title);
        const hitArea = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        hitArea.setAttribute("class", "hit-area"); hitArea.setAttribute("r", dominant ? "26" : "22");
        if (selected) group.appendChild(svgElement("circle", {class: "selection-ring", r: dominant ? 18 : 15}));
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("r", dominant ? "13" : (selected ? "10" : "8"));
        circle.setAttribute("fill", selected ? "var(--safe)" : (model.mode === "relationships" ? "var(--primary)" : nodeColor(node)));
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", dominant ? "0" : "14");
        label.setAttribute("y", dominant ? "-24" : "4");
        if (dominant) label.setAttribute("text-anchor", "middle");
        label.textContent = visibleLabel;
        group.append(hitArea, circle, label); nodeGroup.appendChild(group);
        bindInteraction(group, itemKey);
        nodeVisuals.set(node.id, group);
      }
      model.nodes.forEach(function(node) {
        const nodeKey = model.mode === "relationships" ? "node:" + node.id :
          (node.id === model.center.id ? null : model.items.find(function(item) { return item.neighbor.id === node.id; }).key);
        createNode(node, nodeKey);
      });

      function applyFocus(key, pinned) {
        const effectivePinned = Boolean(key && state.graphPinnedKey === key) || Boolean(pinned);
        const item = key ? itemMap.get(key) : null;
        const activeNodes = new Set(), activeEdges = new Set();
        if (item && item.kind === "relationship-node") {
          activeNodes.add(item.node.id);
          item.incident.forEach(function(pair) {
            activeEdges.add(pair.key); activeNodes.add(pair.source.id); activeNodes.add(pair.target.id);
          });
        } else if (item) {
          activeEdges.add(item.key); activeNodes.add(item.source.id); activeNodes.add(item.target.id);
        }
        edgeVisuals.forEach(function(parts) {
          const focused = activeEdges.has(parts.key);
          parts.line.setAttribute("class", "edge" + (focused ? " is-focused" : "") + (key && !focused ? " dim" : ""));
          parts.label.setAttribute("class", "edge-label" + (focused ? " is-focused" : ""));
          parts.hit.setAttribute("aria-pressed", focused ? "true" : "false");
        });
        nodeVisuals.forEach(function(node, nodeId) {
          const selectedClass = graphSkillId(model.nodes.find(function(itemNode) { return itemNode.id === nodeId; })) === state.selected ? " selected" : "";
          const focused = activeNodes.has(nodeId);
          node.setAttribute("class", "node" + selectedClass + (focused ? " is-focused" : "") + (key && !focused ? " dim" : ""));
          node.setAttribute("aria-pressed", focused ? "true" : "false");
        });
        if (displayedKey === key && displayedPinned === effectivePinned) return;
        displayedKey = key; displayedPinned = effectivePinned;
        renderGraphInspector(model, item, effectivePinned);
      }
      applyFocus(state.graphPinnedKey, Boolean(state.graphPinnedKey));
      if (model.mode === "relationships") {
        if (state.relationshipView === "group") focusRelationshipGroup(false);
        else if (state.relationshipView === "custom") applyGraphCamera();
        else fitGlobalRelationshipGraph(false);
      } else {
        graphCamera.x = 0; graphCamera.y = 0; graphCamera.k = 1;
        applyGraphCamera();
        updateGraphViewControls();
      }
    }
    const highCount = report.summary.severityCounts
      ? (report.summary.severityCounts.high || 0) + (report.summary.severityCounts.critical || 0)
      : (report.summary.candidateSeverityCounts.high || 0) + (report.summary.candidateSeverityCounts.critical || 0);
    document.getElementById("skill-count").textContent = report.summary.skillCount;
    document.getElementById("high-count").textContent = highCount;
    document.getElementById("file-count").textContent = report.actual.fileCount.toLocaleString();
    document.getElementById("report-title").textContent = highCount
      ? "发现 " + highCount + " 个需要优先处理的 Skill"
      : "已完成检查，未发现高风险 Skill";
    document.getElementById("intro-note").textContent =
      "选择一个 Skill 后，可通过节点与连线查看依赖和关系；全局关系图支持缩放与拖拽，选择连线后可聚焦其完整关系组。";
    const visible = renderList();
    const first = visible[0];
    if (first) selectSkill(first.id);
    window.addEventListener("resize", drawGraph);
  </script>
</body>
</html>
